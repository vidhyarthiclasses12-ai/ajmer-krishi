<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>अजमेर कृषि सखी पोर्टल</title>
<style>
  :root { --g:#124c29; --leaf:#1b6b3a; --sand:#f6f3ea; --line:#e3ddd0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",sans-serif; background:var(--sand); color:#1c241c; }
  header { background:var(--g); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  button, input, select, textarea { font:inherit; }
  button { border:0; border-radius:10px; padding:9px 12px; font-weight:700; cursor:pointer; }
  .go { background:var(--leaf); color:#fff; } .line { background:#fff; border:1px solid var(--line); } .bad { background:#fee4e2; color:#b42318; }
  input, select, textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:9px; margin-top:4px; }
  label { font-size:13px; font-weight:700; display:block; margin-top:10px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button.active { background:var(--leaf); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { border-bottom:1px solid var(--line); text-align:left; padding:6px; vertical-align:top; }
  .pill { background:#e8f6ee; color:#067647; border-radius:99px; padding:2px 8px; font-size:11px; font-weight:700; }
  .err { color:#b42318; font-size:13px; }
  img.ph { width:88px; height:88px; object-fit:cover; border-radius:8px; margin:3px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
let me = null, blocks = {};
async function api(url, opt={}) {
  const res = await fetch(url, { headers: opt.body instanceof FormData ? undefined : { "Content-Type":"application/json" }, ...opt });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "त्रुटि");
  return data;
}
async function boot() {
  me = await fetch("/api/me").then(r => r.json());
  if (me) blocks = await api("/api/meta");
  render();
}
function render() { document.getElementById("app").innerHTML = me ? shell() : login(); bind(); }
function login() {
  return `<div class="wrap"><div class="card" style="max-width:420px;margin:40px auto">
    <h2>अजमेर कृषि सखी / CRP</h2>
    <p>केंद्रीय डेटा · क्लस्टर सुरक्षा · फोटो · वेरिफिकेशन</p>
    <label>यूजरनेम</label><input id="u" />
    <label>पासवर्ड</label><input id="p" type="password" />
    <p class="err" id="err"></p>
    <button class="go" id="go" style="width:100%">लॉगिन</button>
    <label>पासवर्ड भूल गए? यूजरनेम</label><input id="ru" />
    <button class="line" id="rst">एडमिन को रीसेट अनुरोध भेजें</button>
    <p style="font-size:12px"></p>
  </div></div>`;
}
function shell() {
  const admin = me.role === "admin";
  return `<header><b>अजमेर पोर्टल</b><span>${me.name} · ${me.role} · ${me.cluster} <button id="out">Logout</button></span></header>
  <div class="wrap"><div class="tabs">
    <button data-t="form" class="active">नया फॉर्म</button>
    <button data-t="excel">Excel</button>
    <button data-t="list">रिपोर्ट</button>
    <button data-t="gallery">फोटो</button>
    ${admin ? `<button data-t="verify">वेरिफिकेशन</button><button data-t="users">यूजर / रीसेट</button>` : ""}
  </div><div id="panel"></div></div>`;
}
function formPanel() {
  const opts = Object.keys(blocks).map(b => `<option ${b===me.cluster?"selected":""}>${b}</option>`).join("");
  return `<div class="card"><h3>परिशिष्ट 8 उपज</h3>
    <div class="grid">
      <div><label>ब्लॉक</label><select id="cluster" ${me.role==="admin"?"":"disabled"}>${opts}</select></div>
      <div><label>गाँव</label><select id="village"></select></div>
      <div><label>किसान</label><input id="farmer" /></div>
      <div><label>फसल</label><input id="crop" /></div>
      <div><label>किस्म</label><select id="kind"><option>अनाज</option><option>तिलहन</option><option>दलहन</option><option>अन्य</option></select></div>
      <div><label>क्षेत्र हेक्टेयर</label><input id="area" type="number" step="0.01" /></div>
      <div><label>उपज प्रकार</label><select id="ytype"><option>अनुमानित</option><option>वास्तविक</option></select></div>
      <div><label>उपज क्विं.</label><input id="yield" type="number" step="0.01" /></div>
    </div>
    <label>फोटो</label><input id="photo" type="file" accept="image/*" />
    <button class="go" id="save" style="margin-top:12px">जमा करें</button></div>`;
}
async function show(tab) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.t===tab));
  const p = document.getElementById("panel");
  if (tab==="form") { p.innerHTML = formPanel(); fillVillages(); document.getElementById("cluster").onchange = fillVillages; document.getElementById("save").onclick = saveForm; }
  if (tab==="excel") p.innerHTML = `<div class="card"><h3>Excel अपलोड</h3><p>डुप्लिकेट हटेगा। जरूरी कॉलम खाली हो तो एरर दिखेगा।</p><input id="xf" type="file" accept=".xlsx" /><button class="go" id="xu">जाँच कर जमा करें</button><div id="xr"></div><p><a href="/api/export">Consolidated Excel</a></p></div>`;
  if (tab==="excel") document.getElementById("xu").onclick = uploadExcel;
  if (tab==="list" || tab==="verify") { const rows = await api("/api/records"); p.innerHTML = list(rows, tab==="verify"); }
  if (tab==="gallery") { const rows = await api("/api/records"); p.innerHTML = `<div class="card"><h3>फोटो गैलरी</h3>${rows.flatMap(r => r.photos.map(ph => `<div><img class="ph" src="/api/photos/${ph.id}" /><div>${r.cluster} · ${r.village} · ${r.id.slice(0,6)}</div></div>`)).join("") || "कोई फोटो नहीं"}</div>`; }
  if (tab==="users") p.innerHTML = await userPanel();
}
function fillVillages() {
  const b = document.getElementById("cluster").value;
  document.getElementById("village").innerHTML = (blocks[b]||[]).map(v => `<option>${v}</option>`).join("");
}
async function saveForm() {
  const payload = { farmer: farmer.value, crop: crop.value, kind: kind.value, area: area.value, yieldType: ytype.value, yield: yield.value };
  if (!payload.farmer || !payload.crop || !payload.area || payload.yield==="") return alert("किसान, फसल, क्षेत्र, उपज जरूरी है");
  const rec = await api("/api/records", { method:"POST", body: JSON.stringify({ cluster: cluster.value, village: village.value, form_type:"परिशिष्ट 8", payload }) });
  const file = document.getElementById("photo").files[0];
  if (file) {
    const fd = new FormData(); fd.append("photo", file);
    await api("/api/records/"+rec.id+"/photo", { method:"POST", body: fd });
  }
  alert("जमा हो गया। स्टेटस: Submitted");
  show("list");
}
async function uploadExcel() {
  const fd = new FormData(); fd.append("file", document.getElementById("xf").files[0]);
  const res = await api("/api/excel", { method:"POST", body: fd });
  document.getElementById("xr").innerHTML = `<p>${res.saved} सही पंक्ति जमा।</p>` + res.errors.map(e => `<p class="err">पंक्ति ${e.row}: ${e.type} — ${e.detail}</p>`).join("");
}
function list(rows, verify) {
  return `<div class="card"><h3>${verify?"वेरिफिकेशन":"रिपोर्ट"}</h3><table><tr><th>तारीख</th><th>कौन</th><th>क्लस्टर</th><th>किसान</th><th>स्टेटस</th><th></th></tr>
  ${rows.map(r => `<tr><td>${r.created_at.slice(0,16)}</td><td>${r.by_name}<div class="pill">${r.role}</div></td><td>${r.cluster}<div>${r.village||""}</div></td><td>${(r.payload.farmer||"")}<div>${r.payload.crop||""}</div></td><td>${r.status}<div>${(r.history||[]).map(h=>h.status+" "+h.at.slice(0,16)).join("<br>")}</div></td>
  <td>${r.photos.map(p=>`<img class="ph" src="/api/photos/${p.id}"/>`).join("")}
  ${me.role==="admin"?`<select onchange="setStatus('${r.id}', this.value)"><option value="">स्टेटस</option><option>correction_required</option><option>approved</option><option>submitted</option></select><input id="n-${r.id}" placeholder="नोट" />`:""}
  ${r.status==="correction_required" && r.user_id===me.id?`<button class="line" onclick="resubmit('${r.id}')">दोबारा जमा</button>`:""}
  </td></tr>`).join("")}</table></div>`;
}
async function delUser(id) { if (!confirm('यह लॉगिन हटाना है?')) return; await api('/api/users/'+id, { method:'DELETE' }); show('users'); }
async function setStatus(id, status) {
  if (!status) return;
  if (!confirm("स्टेटस "+status+" सेव करें?")) return;
  await api("/api/records/"+id+"/status", { method:"POST", body: JSON.stringify({ status, note: document.getElementById("n-"+id).value }) });
  show("verify");
}
async function resubmit(id) {
  await api("/api/records/"+id+"/resubmit", { method:"POST", body: JSON.stringify({ note:"सुधार कर दोबारा जमा", payload:{ farmer:"updated" } }) });
  show("list");
}
async function userPanel() {
  const users = await api("/api/users");
  const resets = await api("/api/resets");
  return `<div class="card"><h3>नया लॉगिन</h3>
    <div class="grid"><div><label>नाम</label><input id="nn" /></div><div><label>रोल</label><select id="nr"><option value="krishi_sakhi">कृषि सखी</option><option value="crp">CRP</option><option value="admin">Admin</option></select></div>
    <div><label>क्लस्टर</label><select id="nc">${Object.keys(blocks).map(b=>`<option>${b}</option>`).join("")}</select></div>
    <div><label>यूजरनेम</label><input id="nu" /></div><div><label>पासवर्ड</label><input id="np" /></div></div>
    <button class="go" id="nuadd">जोड़ें</button></div>
    <div class="card"><h3>यूजर</h3>${users.filter(u=>u.active!==0).map(u=>`<div>${u.name} · ${u.role} · ${u.cluster} · ${u.username} ${u.id===me.id?"":`<button class="bad" onclick="delUser('${u.id}')">हटाएँ</button>`}</div>`).join("")}</div>
    <div class="card"><h3>पासवर्ड रीसेट</h3>${resets.map(r=>`<div>${r.username} · ${r.status}</div>`).join("") || "कोई अनुरोध नहीं"}
    <label>यूजरनेम</label><input id="ru2" /><label>नया पासवर्ड</label><input id="rp2" /><button class="go" id="doreset">रीसेट करें</button></div>`;
}
function bind() {
  const go = document.getElementById("go");
  if (go) {
    go.onclick = async () => {
      try { await api("/api/login", { method:"POST", body: JSON.stringify({ username:u.value, password:p.value }) }); boot(); }
      catch (e) { err.textContent = e.message; }
    };
    document.getElementById("rst").onclick = async () => { await api("/api/reset-request", { method:"POST", body: JSON.stringify({ username:ru.value }) }); alert("अनुरोध भेज दिया"); };
    return;
  }
  document.getElementById("out").onclick = async () => { await api("/api/logout", { method:"POST" }); me=null; render(); };
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.t));
  show("form");
  setTimeout(() => {
    const add = document.getElementById("nuadd");
    if (add) add.onclick = async () => { await api("/api/users", { method:"POST", body: JSON.stringify({ name:nn.value, role:nr.value, cluster:nc.value, username:nu.value, password:np.value }) }); alert("लॉगिन बन गया"); show("users"); };
    const dr = document.getElementById("doreset");
    if (dr) dr.onclick = async () => { await api("/api/admin/reset", { method:"POST", body: JSON.stringify({ username:ru2.value, password:rp2.value }) }); alert("पासवर्ड बदल गया"); };
  }, 300);
}
boot();
</script>
</body>
</html>
