<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ajmer Agriculture Information</title>
<style>
  :root { --side:#14532d; --bg:#f3f4f6; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",sans-serif; background:var(--bg); color:#111827; }
  button, input, select, textarea { font:inherit; }
  button { cursor:pointer; border:0; border-radius:8px; padding:8px 12px; font-weight:700; }
  .go { background:#166534; color:#fff; } .line { background:#fff; border:1px solid #bbf7d0; color:#166534; } .bad { background:#fee2e2; color:#b91c1c; }
  input, select, textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:4px; }
  label { font-size:13px; font-weight:700; display:block; margin-top:8px; }
  .app { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
  aside { background:var(--side); color:#fff; padding:12px; }
  aside button { display:block; width:100%; text-align:left; background:transparent; color:#d1fae5; margin-bottom:4px; }
  aside button.active { background:#166534; color:#fff; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .content { padding:16px; }
  .card { background:#fff; border-radius:12px; padding:14px; border:1px solid #eef2f7; margin-bottom:12px; }
  .schemes { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat { background:#f8fafc; border-radius:10px; padding:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pill { background:#dcfce7; color:#166534; border-radius:99px; padding:2px 8px; font-size:11px; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px; border-bottom:1px solid var(--line); }
  .login { max-width:420px; margin:40px auto; }
  @media (max-width:800px) { .app { grid-template-columns:1fr; } .schemes,.grid { grid-template-columns:1fr; } aside { display:flex; overflow:auto; } aside button { width:auto; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
let me=null, blocks={}, scheme=null, tab="home", year="2026-27", realRole="";
const SCHEMES={
  pkvy:{title:"PKVY", full:"PKVY Master only", prefix:"PKVY-F", menu:["Dashboard","PKVY Master","Bulk Upload","Submit Information","Complete","Reports"]},
  natural:{title:"Natural Farming", full:"Natural Farming Master only", prefix:"NF-F", menu:["Dashboard","Natural Farming Master","Bulk Upload","Submit Information","Complete","Reports"]},
  minikit:{title:"Minikit", full:"Minikit Master only", prefix:"MK-F", menu:["Dashboard","Minikit Master","Bulk Upload","Submit Information","Complete","Reports"]},
  demo:{title:"Demonstration", full:"Demonstration Master only", prefix:"DEM-F", menu:["Dashboard","Demonstration Master","Bulk Upload","Submit Information","Complete","Reports"]}
};
async function api(url, opt={}) {
  const res = await fetch(url, { credentials:"same-origin", ...opt, headers: opt.body instanceof FormData ? undefined : { "Content-Type":"application/json", ...(opt.headers||{}) } });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error||res.status+" request failed");
  return data;
}
async function boot(){ try{ me=await fetch("/api/me").then(r=>r.json()); if(me){ realRole=me.role; blocks=await api("/api/meta"); try{ window.LGD=(await api("/api/directory")).tree||{}; }catch(e){ window.LGD={}; } } }catch(e){ me=null; } render(); }
function render(){ document.getElementById("app").innerHTML = me? shell(): login(); bind(); }
function login(){ return `<div class="card login"><h2 style="color:#166534">Ajmer Agriculture Information</h2><label>Username</label><input id="u"/><label>Password</label><input id="p" type="password"/><p id="err" style="color:#b91c1c"></p><button class="go" id="go" style="width:100%">Login</button><p style="font-size:12px;color:#6b7280">Help: District Agriculture Office, Ajmer · Version 1.0</p></div>`; }
function shell(){
  const items = scheme? SCHEMES[scheme].menu.map(m=>[m,m]) : [["home","Dashboard"],["farmers","Farmer Master"],["users","Users & Roles"],["masters","Master Data"],["notes","Notifications"],["log","Audit Log"],["settings","Settings"]];
  return `<div class="app"><aside><b>KRISHI WEB APP</b>${items.map(([id,label])=>`<button data-t="${id}" class="${tab===id?"active":""}">${label}</button>`).join("")}${scheme?`<button id="back">Main Dashboard</button>`:""}</aside>
  <main><header><div><b>Ajmer Agriculture Information</b><div style="font-size:12px;color:#6b7280">${scheme?SCHEMES[scheme].full:"Department of Agriculture, Ajmer"} · FY ${year}</div></div>
  <span>${realRole==="admin"?`<select id="viewAs"><option value="admin">System Admin</option><option value="district_admin">District Admin</option><option value="aao">AAO</option><option value="supervisor">Supervisor</option><option value="lrp">LRP</option><option value="krishi_sakhi">Krishi Sakhi / CRP</option></select>`:""}<select id="fy"><option>2025-26</option><option selected>2026-27</option><option>2027-28</option></select> ${me.name} · ${me.role} <button id="out" class="line">Logout</button></span></header>
  <div class="content" id="panel"></div></main></div>`;
}
async function show(name){
  tab=name;
  const rows=await api("/api/records");
  const mine=scheme? rows.filter(r=>r.form_type!=="farmer_master" && ((r.payload.scheme||r.form_type)===scheme || (r.payload.scheme||"")===scheme)) : rows;
  const farmers=rows.filter(r=>r.form_type==="farmer_master");
  const panel=document.getElementById("panel");
  if(!scheme && name==="home") panel.innerHTML=home(rows);
  else if(name.endsWith("Master")||name==="farmers") panel.innerHTML=schemeMaster(mine);
  else if(name==="Submit Information") panel.innerHTML=templateView(mine);
  else if(name==="users"||name==="Users & Roles") panel.innerHTML=await userView();
  else if(name==="masters"||name==="Master Data") panel.innerHTML=clusterView(await api("/api/users"));
  else if(name==="Bulk Upload"||name==="excel"||name==="Excel") panel.innerHTML=excelView();
  else if(name==="Complete") panel.innerHTML=(["supervisor","aao","admin","lrp","crp","krishi_sakhi"].includes(me.role))?verifyView(mine):`<div class="card">Sign is not open for this role.</div>`;
  else if(name==="log"||name==="Audit Log") panel.innerHTML=logView(rows);
  else if(name==="notes"||name==="Notifications") panel.innerHTML=await notePage();
  else if(name==="settings"||name==="Settings") panel.innerHTML=`<div class="card"><h3>Change password</h3><label>Current</label><input id="oldp" type="password"/><label>New</label><input id="newp" type="password"/><button class="go" id="chp">Update password</button>${me.role==="admin"?'<p><a href="/api/backup">Download backup</a></p>':""}</div>`;
  else if(name==="Dashboard") panel.innerHTML=schemeDash(mine);
  else if(name==="Reports") panel.innerHTML=reportView(mine);
  else if(name==="Reports") panel.innerHTML=reportView(mine);
  else panel.innerHTML=schemeForm(name, mine);
  wire();
}
function allowedSchemes(){
  if(me.role==="lrp") return ["pkvy"];
  if(me.role==="krishi_sakhi"||me.role==="crp") return ["natural"];
  if(me.role==="supervisor") return ["pkvy","natural","minikit","demo"];
  return ["pkvy","natural","minikit","demo"];
}
function home(rows){
  const card=(key,lines)=>`<div class="card"><h3>${SCHEMES[key].title}</h3><p style="color:#6b7280">${SCHEMES[key].full}</p>${lines.map(x=>`<div class="stat">${x}</div>`).join("")}<button class="go" data-open="${key}">OPEN ${SCHEMES[key].title}</button></div>`;
  const c=k=>rows.filter(r=>(r.payload.scheme||"")===k && (r.payload.year||"2026-27")===year);
  const keys=allowedSchemes();
  const lines={pkvy:["Farmers "+c("pkvy").length,"Pending "+c("pkvy").filter(r=>r.status==="submitted").length], natural:["Farmers "+c("natural").length], minikit:["Distributed "+c("minikit").length], demo:["Planned "+c("demo").length]};
  return `<h2>Main Dashboard</h2><p style="color:#6b7280">${me.role==="supervisor"?"Agriculture Supervisor · apni gram panchayat ki sabhi scheme":me.role==="lrp"?"LRP · sirf PKVY":me.role==="krishi_sakhi"||me.role==="crp"?"Natural Farming only":"All schemes"}</p><div class="schemes">${keys.map(k=>card(k, lines[k])).join("")}</div>`;
}
function schemeDash(rows){
  const map = (me.role==="admin"||me.role==="district_admin") ? `<div class="card"><h3>Cluster map</h3><div class="grid">${lgdSelects()}<div><label>Cluster name</label><input id="mapName"/></div></div><button class="go" id="mapCluster">Map cluster</button></div>` : "";
  const mapped=Object.entries(blocks).filter(([n,c])=>(c.schemes||[]).includes(scheme)).map(([n,c])=>`<div>${n} · ${c.gp||c.block||""}</div>`).join("")||"<p class='muted'>No mapped cluster yet</p>";
  return `<div class="card"><h3>Mapped clusters</h3>${mapped}</div><div class="card"><h3>${SCHEMES[scheme].title} Dashboard</h3><div class="schemes">
    <div class="stat">Records ${rows.length}</div><div class="stat">Pending ${rows.filter(r=>r.status==="submitted").length}</div>
    <div class="stat">Approved ${rows.filter(r=>r.status==="approved").length}</div><div class="stat">Rejected ${rows.filter(r=>r.status==="rejected").length}</div>
  </div></div>${map}`;
}
function lgdSelects(){
  const teh=Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("");
  return `<div><label>Tehsil</label><select id="fteh">${teh}</select></div><div><label>Gram Panchayat</label><select id="fgp"></select></div><div><label>Village</label><select id="village"></select></div>`;
}
function farmerMaster(rows){ rows=scheme?rows.filter(r=>(r.payload.scheme||scheme)===scheme):rows;
  return `<div class="card"><h3>Farmer Master</h3><p>Register a farmer once, then use the same Farmer ID in a scheme.</p><div class="grid"><div><label>Name</label><input id="farmer"/></div><div><label>Father/Husband</label><input id="father"/></div><div><label>Mobile</label><input id="fmobile"/></div><div><label>Jan Aadhaar</label><input id="jan" placeholder="masked in lists"/></div><div><label>Category</label><select id="category"><option>General</option><option>SC</option><option>ST</option><option>OBC</option></select></div>${lgdSelects()}<div><label>Land area</label><input id="area"/></div></div><button class="go" id="saveFarmer">Save farmer</button></div>
  <div class="card"><input id="q" placeholder="Search name / mobile" oninput="filterCards(this)"/><table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Village</th></tr>${rows.map(r=>`<tr data-q="${r.payload.farmer} ${r.payload.mobile}"><td>${r.payload.farmer_id||r.id.slice(0,8)}</td><td>${r.payload.farmer}</td><td>${r.payload.mobile||""}</td><td>${(r.payload.jan||"").length>4?"XXXX"+r.payload.jan.slice(-4):""}</td><td>${r.village||""}</td></tr>`).join("")}</table></div>`;
}

function editView(rows){
  const open=rows.filter(r=>["submitted","draft","returned","correction_required"].includes(r.status));
  return `<div class="card"><h3>Edit uploaded data</h3><p>Excel rows can be edited until signed. Reverted rows also appear here.</p>
    ${open.map(r=>`<div style="border-bottom:1px solid #eee;padding:8px 0"><b>${r.payload["Farmer Name"]||r.payload.farmer||""}</b> <span class="pill">${r.status}</span>
      <div class="grid"><div><label>Farmer Name</label><input id="e-name-${r.id}" value="${r.payload["Farmer Name"]||r.payload.farmer||""}"/></div>
      <div><label>Village</label><input id="e-vill-${r.id}" value="${r.payload.Village||r.village||""}"/></div>
      <div><label>Mobile</label><input id="e-mob-${r.id}" value="${r.payload.Mobile||""}"/></div>
      <div><label>Crop</label><input id="e-crop-${r.id}" value="${r.payload.Crop||""}"/></div></div>
      <button class="go" data-edit="${r.id}">Save edit</button></div>`).join("")||"<p>No editable records. Signed data is locked.</p>"}
  </div>`;
}

function schemeMaster(rows){
  const list=rows.filter(r=>r.form_type===scheme||r.payload.scheme===scheme);
  return `<div class="card"><h3>${SCHEMES[scheme].title} Master</h3><p>This farmer stays in ${SCHEMES[scheme].title} only. ID ${SCHEMES[scheme].prefix}-000001</p>
    <div class="grid"><div><label>Name</label><input id="mname"/></div><div><label>Father</label><input id="mfather"/></div><div><label>Mobile</label><input id="mmob"/></div><div><label>Village</label><input id="mvillage"/></div><div><label>GP</label><input id="mgp2"/></div><div><label>Cluster</label><input id="mcluster"/></div></div>
    <button class="go" id="addMaster">Add farmer</button>
    <table><tr><th>ID</th><th>Name</th><th>Village</th><th>Cluster</th><th>Status</th></tr>${list.map(r=>`<tr><td>${r.payload.farmer_id||""}</td><td>${r.payload["Farmer Name"]||r.payload.farmer||""}</td><td>${r.payload.Village||""}</td><td>${r.payload["Cluster ID"]||""}</td><td>${r.status}</td></tr>`).join("")}</table>
  </div>`;
}
function templateView(rows){
  const need=scheme==="natural"?125:scheme==="pkvy"?25:1;
  const n=rows.length;
  const ready=n>=need;
  return `<div class="card"><h3>Submit Information</h3><p>Data comes from ${SCHEMES[scheme].title} Master. Farmers ${n}/${need}.</p>
    <table><tr><th>ID</th><th>Name</th><th>Village</th><th>Cluster</th></tr>${rows.map(r=>`<tr><td>${r.payload.farmer_id||""}</td><td>${r.payload["Farmer Name"]||r.payload.farmer||""}</td><td>${r.payload.Village||r.village||""}</td><td>${r.payload["Cluster ID"]||r.cluster||""}</td></tr>`).join("")}</table>
    ${ready?`<button class="go" id="sendSign">Submit for sign</button>`:`<p>Submit stays hidden until ${need} farmers are in this scheme.</p>`}
  </div>`;
}
function schemeForm(name, rows){
  const common = ["Farmer ID","Farmer Name","Father/Husband Name","Gender","Category","Mobile","Jan Aadhaar","District","Tehsil","Block","Gram Panchayat","Village","Total Land Area"];
  const extra = {
    pkvy:["Financial Year","Season","PKVY Cluster ID","Registration Date","Participation Status","Existing/New","Khasra No","Cultivated Area","PKVY Area","Land Ownership","Soil Test","Crop","Variety","Crop Area","Activity","Activity Area","Remarks"],
    natural:["Financial Year","Season","Cluster ID","Adoption Status","Existing/New","Khasra No","Natural Farming Area","Practice","Practice Area","Crop","Variety","Input Name","Input Quantity","Training Attended","Training Date","Remarks"],
    minikit:["Financial Year","Component","Distribution Date","Distribution Location","Crop","Variety","Item Name","Lot/Batch No","Quantity","Unit","Receiver Confirmation"],
    demo:["Financial Year","Demonstration Type","Category","Season","Demonstration Date","Location","Khasra No","Demonstration Area","Crop","Variety","Technology","Intervention","Expected Yield","Demonstration Yield","Result"]
  }[scheme]||[];
  const opts = {Season:["Kharif","Rabi","Zaid"], "Land Ownership":["Owner","Lease"], "Soil Test":["No","Yes"], "Existing/New":["Existing","New"], "Participation Status":["Active","Inactive"], "Adoption Status":["Adopted","Partial","Not adopted"], Practice:["Beejamrit","Jeevamrit","Ghan Jeevamrit","Mulching","Waaphasa","Intercropping","Other"], Unit:["Kg","Gram","Litre","Packet"], Component:["Seed","Nutrient","Other"], "Demonstration Type":["Crop","Technology","Input"], Category:["Frontline","Cluster"], "Receiver Confirmation":["Yes","No"]};
  const field=(label, ro)=>`<div><label>${label}</label>${opts[label]?`<select id="f-${label.replace(/[^a-zA-Z]/g,"")}" ${ro}>${opts[label].map(o=>`<option>${o}</option>`).join("")}</select>`:`<input id="f-${label.replace(/[^a-zA-Z]/g,"")}" ${ro?"readonly":""}/>`}</div>`;
  return `<div class="card"><h3>${SCHEMES[scheme].title} · ${name}</h3><label>Farmer ID search</label><input id="searchFarmer" placeholder="FRM-2026"/><button type="button" class="line" id="loadFarmer">Load master</button><p id="masterBox" class="muted"></p><div class="grid">${common.map(f=>field(f,true)).join("")}${extra.map(f=>field(f,false)).join("")}</div><p id="cond"></p><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"/><button class="line" id="draft">Save draft</button> <button class="go" id="submit">Submit</button></div><div class="card">${rows.filter(r=>r.payload.section===name).map(r=>`<div>${r.payload.application_no} · ${r.payload.farmer||""} <span class="pill">${r.status}</span></div>`).join("")||"No records"}</div>`;
}
function verifyView(rows){
  const mine=rows.filter(r=>{
    const field = scheme==="pkvy"||scheme==="natural";
    if(me.role==="lrp") return field && (r.status==="submitted"||r.status==="returned");
    if(me.role==="crp"||me.role==="krishi_sakhi") return scheme==="natural" && ["submitted","returned","draft"].includes(r.status);
    if(me.role==="aao") return r.status==="supervisor_signed" || r.status==="signed";
    if(me.role==="supervisor") return field ? r.status==="sakhi_signed" : (r.status==="submitted"||r.status==="draft"||r.status==="returned");
    return true;
  });
  return `<div class="card"><h3>${me.role==="aao"?"AAO verification":"Supervisor complete"}</h3>
    <p class="muted">${mine.length} record. Draw a signature or upload a photo below, then Sign and submit.</p>
    ${mine.map(r=>`<div style="border-bottom:1px solid #eee;padding:10px 0"><b>${r.payload.application_no||r.id.slice(0,6)}</b> ${r.payload.farmer||r.payload["Farmer Name"]||""} · ${r.payload.Village||r.village||""} <span class="pill">${r.status}</span>
      <label>Remark</label><input id="rm-${r.id}"/>
      <label>Draw signature</label><canvas id="sig-${r.id}" width="280" height="80" style="border:1px solid #ccc;background:#fff"></canvas>
      <button type="button" class="line" data-clear="${r.id}">Clear</button>
      <label>Ya signature photo</label><input id="sigf-${r.id}" type="file" accept="image/*"/>
      <button class="go" data-wf="${r.id}" data-a="sign">Sign & submit</button>
      <button class="line" data-wf="${r.id}" data-a="return">Return</button>
    </div>`).join("")||"<p>No pending records. They appear for AAO only after the supervisor signs.</p>"}</div>`;
}
function reportView(rows){
  const ready=rows.filter(r=>["aao_approved","supervisor_signed","signed"].includes(r.status)||me.role==="admin"||me.role==="district_admin");
  window.REPORT_ROWS=ready;
  return `<div class="card"><h3>${SCHEMES[scheme].title} Report</h3><p>${ready.length} records</p>
    <label>Format</label><select id="fmt"><option>Farmer list</option><option>Activity</option><option>Cluster</option><option>Signed summary</option></select>
    <label><input type="checkbox" id="mask" checked/> Mask Jan Aadhaar</label>
    <button class="go" id="doPdf">Generate PDF</button> <a href="/api/export">Export Excel</a>
    <div id="pdfBox"></div>
    <table><tr><th>Cluster</th><th>Farmer</th><th>Village</th><th>Status</th><th>Jan</th></tr>${ready.map(r=>`<tr><td>${r.payload["Cluster ID"]||r.cluster||""}</td><td>${r.payload.farmer||r.payload["Farmer Name"]||""}</td><td>${r.payload.Village||r.village||""}</td><td>${r.status}</td><td>${String(r.payload["Jan Aadhaar"]||r.payload.jan||"").slice(-4)}</td></tr>`).join("")||"<tr><td colspan=5>No signed records in this scheme</td></tr>"}</table>
    ${me.role==="district_admin"||me.role==="admin"?`<h3>Revert signed report</h3><input id="revC" placeholder="Cluster ID"/><input id="revR" placeholder="Reason"/><button class="line" id="rev">Revert</button>`:""}
  </div>`;
}
function clusterView(users=[]){
  const tehs = Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("");
  const map = me.role==="admin" ? `<div class="card"><h3>Map village</h3>
    <div class="grid"><div><label>Tehsil</label><select id="mteh">${tehs}</select></div>
    <div><label>Gram Panchayat</label><select id="mgp"></select></div>
    <div><label>Village name</label><input id="mvill"/></div></div>
    <button class="go" id="mapv">Add to dropdown</button></div>` : `<div class="card">Only System Admin can map a village. Use the dropdown.</div>`;
  const gpMap = (me.role==="admin"||me.role==="district_admin") ? `<div class="card"><h3>Supervisor GP map</h3><p>Mapping a GP will automatically add its cluster and villages.</p><label>Supervisor</label><select id="supUser">${users.filter(u=>u.role==="supervisor"&&u.active!==0).map(u=>`<option value="${u.username}">${u.name} · ${u.username}</option>`).join("")||"<option value=\"\">Create a supervisor first</option>"}</select><div class="grid"><div><label>Tehsil</label><select id="steh">${Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("")}</select></div><div><label>Gram Panchayat</label><select id="sgp"></select></div></div><button class="go" id="mapGp">Map GP</button></div>` : "";
  return `<div class="card"><h3>Master Data</h3><p>Tehsil ${Object.keys(window.LGD||{}).length}</p></div>${map}${gpMap}`;
}
async function notePage(){ const rows=await api('/api/notifications'); return `<div class='card'><h3>Notifications</h3>${rows.map(n=>`<div>${n.at} · ${n.status} · ${n.note||''} · ${n.by_name}</div>`).join('')||'No notifications'}</div>`; }
function excelView(){ const key=scheme||"pkvy"; return `<div class="card"><h3>${scheme?SCHEMES[scheme].title:"Scheme"} Excel</h3><p><a href="/api/template?scheme=${key}">Download ${key} template</a></p><input id="xf" type="file" accept=".xlsx,.jpg,.jpeg,.png"/><button class="line" id="xp">Preview</button> <button class="go" id="xu">Upload Excel</button><p>Or photo / handwritten sheet</p><input id="pf" type="file" accept="image/*" capture="environment"/><button class="line" id="pu">Read photo</button><div id="xr"></div><p>Add a photo from the form camera or gallery.</p></div>`; }
function logView(rows){ const logs=rows.flatMap(r=>(r.history||[]).map(h=>`<tr><td>${h.at.slice(0,16)}</td><td>${h.by_name}</td><td>${h.status}</td><td>${h.note||""}</td></tr>`)); return `<div class="card"><h3>Audit Log</h3><table><tr><th>Time</th><th>User</th><th>Status</th><th>Remark</th></tr>${logs.join("")}</table></div>`; }
async function userView(){ if(me.role!=="admin"&&me.role!=="district_admin") return `<div class="card">Only System Admin and District Admin can manage users.</div>`; const users=await api("/api/users"); return `<div class="card"><h3>New user</h3><div class="grid"><div><label>Name</label><input id="nn"/></div><div><label>Role</label><select id="nr">${me.role==="admin"?'<option value="district_admin">District Admin</option>':''}<option value="aao">Assistant Agriculture Officer</option><option value="supervisor">Agriculture Supervisor</option><option value="lrp">LRP · PKVY</option><option value="krishi_sakhi">Krishi Sakhi / CRP · Natural Farming</option></select></div><div id="clusterBox"><label>Mapped cluster</label><select id="ncl"></select></div><div id="postBox"><label>Post</label><input id="npost" placeholder="Agriculture Research Officer"/></div><div><label>Mobile</label><input id="nm"/></div><div><label>Username</label><input id="nu"/></div><div><label>Password</label><input id="np"/></div></div><div id="aaoBox"><label>AAO mapping</label><div class="grid"><div><label>Block</label><select id="aaoBlock">${Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("")}</select></div><div><label>Supervisors in block</label><select id="aaoSup" multiple></select></div><div><label>Office is at</label><select id="aaoOffice"><option value="block">Block</option><option value="gp">Gram Panchayat</option></select></div><div><label>Office name</label><select id="aaoOfficeName"></select></div></div></div><div id="supGpBox"><label>Supervisor GP assign</label><div class="grid"><div><label>Tehsil</label><select id="nteh">${Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("")}</select></div><div><label>Gram Panchayat</label><select id="ngp"></select></div></div></div><button class="go" id="nuadd">Add</button><div>${users.filter(u=>u.active!==0).map(u=>`<div>${u.name} · ${u.role} · ${u.username} ${me.role==="admin"&&u.id!==me.id?`<button class="bad" data-del="${u.id}">Delete</button>`:""}</div>`).join("")}</div></div>`; }
function fillVillages(){ const teh=document.getElementById("fteh"), gp=document.getElementById("fgp"), vill=document.getElementById("village"); if(!teh||!gp||!vill) return; const keep=gp.value; gp.innerHTML=Object.keys((window.LGD||{})[teh.value]||{}).map(g=>`<option ${g===keep?"selected":""}>${g}</option>`).join(""); vill.innerHTML=(((window.LGD||{})[teh.value]||{})[gp.value]||[]).map(v=>`<option>${v}</option>`).join(""); }
async function saveRecord(status){
  const payload={ scheme, year, section:tab, application_no:(scheme||"GEN").toUpperCase()+"-"+Date.now().toString().slice(-8), farmer: (document.getElementById("farmer")||{}).value || (document.getElementById("searchFarmer")||{}).value, status };
  document.querySelectorAll("[id^='f-']").forEach(el=>payload[el.id.slice(2)]=el.value);
  const all=await api("/api/records");
  const same=all.filter(r=>(r.payload.scheme||r.form_type)===scheme && (r.payload.PKVYClusterID||r.cluster)=== (payload.PKVYClusterID||me.cluster));
  if(scheme==="pkvy" && same.length>=25) return alert("A PKVY cluster cannot have more than 25 farmers");
  if(scheme==="natural" && same.length>=125) return alert("A Natural Farming cluster cannot have more than 125 farmers");
  const rec=await api("/api/records",{method:"POST", body:JSON.stringify({ cluster:me.cluster, village:(document.getElementById("village")||{}).value||"", form_type:scheme||"common", payload })});
  const area=Number(payload.PKVYArea||payload.NaturalFarmingArea||payload.DemonstrationArea||payload.CropArea||0);
  const land=Number(payload.TotalLandArea||0);
  if(land && area>land) return alert("Scheme area cannot be larger than total land");
  if(Number(payload.InputQuantity||payload.Quantity||0)<0) return alert("Quantity cannot be negative");
  const file=document.getElementById("photo")&&document.getElementById("photo").files[0];
  if(file){ const fd=new FormData(); fd.append("photo", file); await api("/api/records/"+rec.id+"/photo",{method:"POST", body:fd}); }
  alert(status==="draft"?"Draft saved":"Submitted"); show(tab);
}
function wire(){
  fillVillages();
  const teh=document.getElementById("fteh"); if(teh) teh.onchange=()=>fillVillages();
  const gp=document.getElementById("fgp"); if(gp) gp.onchange=()=>fillVillages();
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ scheme=b.dataset.open; tab="Dashboard"; render(); });
  const back=document.getElementById("back"); if(back) back.onclick=()=>{ scheme=null; tab="home"; render(); };
  const fy=document.getElementById("fy"); if(fy) fy.onchange=()=>{ year=fy.value; show(tab); };
  const viewAs=document.getElementById("viewAs"); if(viewAs){ viewAs.value=me.role; viewAs.onchange=()=>{ me.role=viewAs.value; render(); }; }
  const doPdf=document.getElementById("doPdf"); if(doPdf) doPdf.onclick=()=>{
    const mask=document.getElementById("mask").checked;
    const rows=window.REPORT_ROWS||[];
    if(!rows.length) return alert("No records to print");
    const body=rows.map(r=>{ const jan=String(r.payload["Jan Aadhaar"]||r.payload.jan||""); const show=mask&&jan.length>4?"XXXX"+jan.slice(-4):jan; return `<tr><td>${r.payload["Cluster ID"]||r.cluster||""}</td><td>${r.payload.farmer||r.payload["Farmer Name"]||""}</td><td>${r.payload.Mobile||r.payload.mobile||""}</td><td>${r.payload.Village||r.village||""}</td><td>${r.payload.Crop||""}</td><td>${show}</td><td>${r.status}</td></tr>`; }).join(""); const block=(rows[0]&&(rows[0].payload.Block||rows[0].payload.Tehsil||rows[0].payload.block))||"Ajmer";
    const gp=(rows[0]&&(rows[0].payload.GP||rows[0].payload["Gram Panchayat"]||rows[0].village))||"";
    const postOf=role=>role==="aao"?"Assistant Agriculture Officer":role==="lrp"?"LRP":role==="crp"?"CRP":role==="krishi_sakhi"||role==="crp"?"Krishi Sakhi / CRP":"Agriculture Supervisor";
    const clusterName=(rows[0]&&(rows[0].payload["Cluster ID"]||rows[0].cluster))||""; const third=role=>role==="aao"?block:(role==="lrp"||role==="crp"||role==="krishi_sakhi")?clusterName:(gp||block);
    const latest={};
    rows.forEach(r=>(r.signatures||[]).forEach(sg=>{ latest[sg.role]=sg; }));
    const signs=Object.values(latest).map(sg=>`<div style="display:inline-block;margin:16px;text-align:center"><img src="${sg.image}" style="height:70px;border-bottom:1px solid #000"/><div>${sg.by_name}</div><div>${postOf(sg.role)}</div><div>${third(sg.role)}</div></div>`).join("")||"<p>No signature image saved yet.</p>";
    const html=`<h2>Office of Assistant Agriculture Officer, ${block}</h2><h3>${SCHEMES[scheme].title} signed report</h3><table border="1" cellpadding="6"><tr><th>Cluster ID</th><th>Farmer</th><th>Mobile</th><th>Village</th><th>Crop</th><th>Jan Aadhaar</th><th>Status</th></tr>${body}</table><h3>Signatures</h3>${signs}`;
    document.getElementById("pdfBox").innerHTML=html+`<p><button class="go" id="printPdf">Print</button></p>`;
    document.getElementById("printPdf").onclick=()=>{ const w=window.open(""); w.document.write(html); w.document.close(); w.print(); };
  };
  const rev=document.getElementById("rev"); if(rev) rev.onclick=async()=>{ try{ const r=await api("/api/revert",{method:"POST", body:JSON.stringify({cluster:revC.value, reason:revR.value})}); alert(r.count+" records wapas bheje"); }catch(e){ alert(e.message);} };
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=async()=>{ try{ await api("/api/records/"+b.dataset.edit+"/edit",{method:"POST", body:JSON.stringify({payload:{"Farmer Name":document.getElementById("e-name-"+b.dataset.edit).value, farmer:document.getElementById("e-name-"+b.dataset.edit).value, Village:document.getElementById("e-vill-"+b.dataset.edit).value, Mobile:document.getElementById("e-mob-"+b.dataset.edit).value, Crop:document.getElementById("e-crop-"+b.dataset.edit).value}})}); alert("Saved"); show("Edit data"); }catch(e){ alert(e.message);} });
  const sendSign=document.getElementById("sendSign"); if(sendSign) sendSign.onclick=async()=>{ alert("Sent to Complete for signature"); show("Complete"); };
  const addMaster=document.getElementById("addMaster"); if(addMaster) addMaster.onclick=async()=>{ const n=Date.now().toString().slice(-6); await api("/api/records",{method:"POST", body:JSON.stringify({cluster:mcluster.value||me.cluster, village:mvillage.value, form_type:scheme, payload:{scheme, farmer_id:SCHEMES[scheme].prefix+"-"+n, "Farmer Name":mname.value, farmer:mname.value, Father:mfather.value, Mobile:mmob.value, Village:mvillage.value, GP:mgp2.value, "Cluster ID":mcluster.value}})}); alert("Saved in "+SCHEMES[scheme].title+" only"); show(SCHEMES[scheme].title+" Master"); };
  const sf=document.getElementById("saveFarmer"); if(sf) sf.onclick=async()=>{ await api("/api/records",{method:"POST", body:JSON.stringify({ cluster:me.cluster, village:village.value, form_type:"farmer_master", payload:{ farmer_id:"FRM-2026-"+Date.now().toString().slice(-6), farmer:farmer.value, father:father.value, mobile:fmobile.value, category:category.value, jan: (document.getElementById("jan")||{}).value||"", year }})}); show("farmers"); };
  const loadF=document.getElementById("loadFarmer"); if(loadF) loadF.onclick=async()=>{ const rows=await api("/api/records"); const q=(searchFarmer.value||"").toLowerCase(); const f=rows.find(r=>r.form_type==="farmer_master" && ((r.payload.farmer_id||"")+(r.payload.farmer||"")+(r.payload.mobile||"")).toLowerCase().includes(q)); if(!f) return alert("Farmer was not found in Farmer Master"); document.getElementById("masterBox").textContent="Loaded "+f.payload.farmer_id+" · "+f.payload.farmer+" · "+(f.payload.father||"")+" · "+(f.village||""); searchFarmer.value=f.payload.farmer_id; };
  const sub=document.getElementById("submit"); if(sub) sub.onclick=()=>saveRecord("submitted");
  const dr=document.getElementById("draft"); if(dr) dr.onclick=()=>saveRecord("draft");
  document.querySelectorAll("canvas[id^=sig-]").forEach(c=>{ const ctx=c.getContext("2d"); let draw=false; c.onpointerdown=e=>{ draw=true; ctx.beginPath(); ctx.moveTo(e.offsetX,e.offsetY); }; c.onpointermove=e=>{ if(!draw) return; ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke(); }; c.onpointerup=()=>draw=false; });
  document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{ const c=document.getElementById("sig-"+b.dataset.clear); c.getContext("2d").clearRect(0,0,c.width,c.height); });
  document.querySelectorAll("[data-wf]").forEach(b=>b.onclick=async()=>{ try{ const note=(document.getElementById("rm-"+b.dataset.wf)||{}).value||""; if(b.dataset.a==="return"&&!note) return alert("A reason is required"); const canvas=document.getElementById("sig-"+b.dataset.wf); const file=(document.getElementById("sigf-"+b.dataset.wf)||{}).files; if(b.dataset.a==="sign" && canvas && !file?.[0]){ const blank=document.createElement("canvas"); blank.width=canvas.width; blank.height=canvas.height; if(canvas.toDataURL()===blank.toDataURL()) return alert("Draw a signature or upload a signature photo first"); }
    await api("/api/workflow/"+b.dataset.wf,{method:"POST", body:JSON.stringify({action:b.dataset.a, note, actor:me.role, signature:canvas?canvas.toDataURL():""})}); alert("Signature saved"); show("Complete"); }catch(e){ alert(e.message);} });
  const fillMap=()=>{ const t=document.getElementById("mteh"), g=document.getElementById("mgp"); if(!t||!g) return; const keep=g.value; g.innerHTML=Object.keys((window.LGD||{})[t.value]||{}).map(x=>`<option ${x===keep?"selected":""}>${x}</option>`).join(""); };
  if(document.getElementById("mteh")){ fillMap(); document.getElementById("mteh").onchange=fillMap; document.getElementById("mgp").onchange=fillMap; }
  const mapCluster=document.getElementById("mapCluster");
  if(mapCluster) mapCluster.onclick=async()=>{ const vill=document.getElementById("village"); const picked=vill?[...vill.selectedOptions].map(o=>o.value).filter(Boolean):[]; const res=await api("/api/map/cluster",{method:"POST", body:JSON.stringify({scheme, name:mapName.value, tehsil:fteh.value, gp:fgp.value, villages:picked.length?picked:[vill.value]})}); blocks=await api("/api/meta"); alert("Cluster mapped. ID: "+(res.cluster_id||"")); show("Dashboard"); };
  const mapGp=document.getElementById("mapGp");
  if(document.getElementById("steh")){ const fill=()=>{ g=sgp; g.innerHTML=Object.keys((window.LGD||{})[steh.value]||{}).map(x=>`<option>${x}</option>`).join(""); }; fill(); steh.onchange=fill; }
  if(document.getElementById("nteh")){ const filln=()=>{ ngp.innerHTML=Object.keys((window.LGD||{})[nteh.value]||{}).map(x=>`<option>${x}</option>`).join(""); }; filln(); nteh.onchange=filln; }
  const fillAao=async()=>{ const users=await api("/api/users"); const block=aaoBlock.value; aaoSup.innerHTML=users.filter(u=>u.role==="supervisor" && ((u.cluster||"")+(u.name||"")).toLowerCase().includes(block.toLowerCase())).map(u=>`<option value="${u.username}">${u.name} · ${u.username} · ${u.cluster||""}</option>`).join(""); const gps=Object.keys((window.LGD||{})[block]||{}); aaoOfficeName.innerHTML=(aaoOffice.value==="gp"?gps:[block]).map(x=>`<option>${x}</option>`).join(""); };
  if(document.getElementById("aaoBlock")){ aaoBlock.onchange=fillAao; aaoOffice.onchange=fillAao; }
  const fillClusters=()=>{ const box=document.getElementById("ncl"); if(!box) return; const role=nr.value; const want=role==="lrp"?"pkvy":(role==="krishi_sakhi"||role==="crp")?"natural":""; box.innerHTML=Object.entries(blocks).filter(([n,c])=>!want||(c.schemes||[]).includes(want)).map(([n])=>`<option>${n}</option>`).join("")||"<option>Map a cluster in the scheme first</option>"; };
  const toggleRole=()=>{
    if(!document.getElementById("nr")) return;
    const role=nr.value;
    document.getElementById("supGpBox").style.display=role==="supervisor"?"":"none"; document.getElementById("aaoBox").style.display=role==="aao"?"":"none"; if(role==="aao") fillAao();
    document.getElementById("postBox").style.display=role==="district_admin"?"":"none";
    document.getElementById("clusterBox").style.display=(role==="krishi_sakhi"||role==="crp"||role==="lrp")?"":"none";
  };
  if(document.getElementById("nr")){ toggleRole(); fillClusters(); nr.onchange=()=>{ toggleRole(); fillClusters(); }; }
  if(mapGp) mapGp.onclick=async()=>{ const r=await api("/api/map/gp",{method:"POST", body:JSON.stringify({username:supUser.value, tehsil:steh.value, gp:sgp.value})}); alert("Cluster auto add: "+r.cluster); blocks=await api("/api/meta"); };
  const mapv=document.getElementById("mapv");
  if(mapv) mapv.onclick=async()=>{ await api("/api/directory/village",{method:"POST", body:JSON.stringify({tehsil:mteh.value, gp:mgp.value, village:mvill.value})}); window.LGD=(await api("/api/directory")).tree||{}; alert("Added to the dropdown"); show("masters"); };
  const chp=document.getElementById("chp"); if(chp) chp.onclick=async()=>{ try{ await api("/api/password",{method:"POST", body:JSON.stringify({old:oldp.value,password:newp.value})}); alert("Password updated"); }catch(e){ alert(e.message);} };
  const sendExcel=async(preview)=>{ const file=document.getElementById("xf").files[0]; if(!file) return alert("Choose an Excel file first"); const fd=new FormData(); fd.append("file", file); fd.append("scheme", scheme||"pkvy"); if(preview) fd.append("preview","1"); const res=await api("/api/excel",{method:"POST", body:fd}); document.getElementById("xr").innerHTML=`<p><b>${res.message||""}</b></p><p>Valid ${res.valid||res.saved||0}. Invalid ${(res.errors||[]).length}</p>`+(res.errors||[]).map(e=>`<p style="color:#b91c1c">Row ${e.row}: ${String(e.detail||"").replace(/</g,"")}</p>`).join("")+(res.error_file?`<p><a href="/api/errors/${res.error_file}">Download error sheet</a></p>`:""); };
  const xp=document.getElementById("xp"); if(xp) xp.onclick=()=>sendExcel(true).catch(e=>alert(e.message));
  const pu=document.getElementById("pu"); if(pu) pu.onclick=async()=>{ try{ const file=document.getElementById("pf").files[0]; if(!file) return alert("Choose a photo"); const fd=new FormData(); fd.append("file", file); fd.append("scheme", scheme||"pkvy"); const res=await api("/api/photo-excel",{method:"POST", body:fd}); document.getElementById("xr").innerHTML=`<p>${res.message}</p>`+(res.ok?`<button class="go" id="photoSubmit">Submit to master</button>`:`<p>Reupload a new photo.</p>`)+`<pre>${res.text||""}</pre>`; const b=document.getElementById("photoSubmit"); if(b) b.onclick=()=>{ alert("Added to Farmer Master and Submit Information"); show("Submit Information"); }; }catch(e){ alert(e.message);} };
  const xu=document.getElementById("xu");
  if(xu) xu.onclick=async()=>{
    try{
      const file=document.getElementById("xf").files[0];
      if(!file) return alert("Choose an Excel file first");
      const fd=new FormData();
      fd.append("file", file);
      fd.append("scheme", scheme||"pkvy");
      const res=await api("/api/excel",{method:"POST", body:fd});
      document.getElementById("xr").innerHTML=`<p><b>${res.message||""}</b></p><p>${res.saved||0} saved. Invalid ${(res.errors||[]).length}</p>`+(res.errors||[]).map(e=>`<p style="color:#b91c1c">Row ${e.row}: ${String(e.detail||"").replace(/</g,"")}</p>`).join("")+(res.error_file?`<p><a class="go" href="/api/errors/${res.error_file}">Download error sheet</a></p>`:"<p>No errors</p>");
    }catch(e){ alert(e.message); }
  };
  const add=document.getElementById("nuadd"); if(add) add.onclick=async()=>{
    try {
      const role=document.getElementById("nr").value;
      const clusterEl=document.getElementById("ncl");
      const cluster=clusterEl&&clusterEl.value&&!clusterEl.value.startsWith("Pehle")?clusterEl.value:"All";
      if((role==="lrp"||role==="krishi_sakhi"||role==="crp"||role==="supervisor") && cluster==="All") return alert("Map a cluster first");
      await api("/api/users",{method:"POST", body:JSON.stringify({name:document.getElementById("nn").value, role, cluster, mobile:document.getElementById("nm").value, username:document.getElementById("nu").value, password:document.getElementById("np").value})});
      if(role==="supervisor"){ const r=await api("/api/map/gp",{method:"POST", body:JSON.stringify({username:document.getElementById("nu").value, tehsil:document.getElementById("nteh").value, gp:document.getElementById("ngp").value})}); alert("GP and cluster assigned: "+r.cluster); }
      if(role==="aao"){ const picked=[...document.getElementById("aaoSup").selectedOptions].map(o=>o.value); await api("/api/map/aao",{method:"POST", body:JSON.stringify({username:document.getElementById("nu").value, block:aaoBlock.value, office_type:aaoOffice.value, office_name:aaoOfficeName.value, supervisors:picked})}); alert("AAO mapped"); }
      else alert("User created");
      show("users");
    } catch(e) { alert(e.message); }
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("Delete?")) return; await api("/api/users/"+b.dataset.del,{method:"DELETE"}); show("users"); });
}
function filterCards(el){ document.querySelectorAll("[data-q]").forEach(n=>n.style.display=n.dataset.q.toLowerCase().includes(el.value.toLowerCase())?"":"none"); }
function bind(){ const go=document.getElementById("go"); if(go){ go.onclick=async()=>{ try{ await api("/api/login",{method:"POST", body:JSON.stringify({username:u.value,password:p.value})}); boot(); }catch(e){ err.textContent=e.message; } }; return; } document.getElementById("out").onclick=async()=>{ await api("/api/logout",{method:"POST"}); me=null; scheme=null; render(); }; document.querySelectorAll("aside button[data-t]").forEach(b=>b.onclick=()=>show(b.dataset.t)); show(scheme?tab:"home"); }
boot();
