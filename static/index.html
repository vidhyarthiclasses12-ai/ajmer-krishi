<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ajmer Agriculture Information</title>
<style>
  :root { --bg:#f7f8f6; --ink:#1b2420; --muted:#66736c; --green:#1f6b45; --line:#e4ebe6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  button, input, select, textarea { font:inherit; }
  button { border:0; border-radius:8px; padding:9px 14px; cursor:pointer; }
  input, select, textarea { width:100%; border:1px solid #d5ded8; border-radius:8px; padding:9px 11px; background:#fff; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
  .app { display:flex; min-height:100vh; background:url('/static/main-temple.jpg') center/cover no-repeat fixed; }
  aside { width:250px; background:rgba(214,236,214,.72); color:#14532d; padding:18px 12px; backdrop-filter:blur(2px); }
  aside b { display:block; font-size:13px; letter-spacing:.08em; color:#14532d; padding:6px 10px 16px; }
  aside button { display:block; width:100%; text-align:left; background:transparent; color:#14532d; margin:2px 0; border-radius:8px; }
  aside button.active, aside button.on { background:rgba(31,107,69,.85); color:#fff; font-weight:650; }
  main { flex:1; min-width:0; background:transparent; }
  header { display:flex; justify-content:space-between; gap:16px; align-items:center; background:#fff; padding:14px 22px; border-bottom:1px solid var(--line); }
  .content { padding:22px; background:rgba(255,255,255,.82); min-height:calc(100vh - 70px); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  .login { max-width:400px; margin:12vh auto; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .schemes, .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .stat { background:#f4f7f5; border-radius:10px; padding:12px 14px; }
  .go { background:var(--green); color:#fff; }
  .line { background:#fff; border:1px solid #c9ddd1; color:var(--green); }
  .bad { background:#fdecec; color:#9f1239; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  h2, h3 { margin:0 0 12px; font-weight:650; }
  @media (max-width:800px) { .app { display:block; } aside { width:100%; } .grid { grid-template-columns:1fr; } header { display:block; } }
</style>
</head>
<body>
<div id="app"><div class="card login"><h2>Ajmer Agriculture Information</h2><p>Loading...</p></div></div>
<script>
let me=null, blocks={}, scheme=null, tab="home", year="2026-27", realRole="";
const SCHEMES={
  pkvy:{title:"PKVY", full:"PKVY Master only", prefix:"PKVY-F", menu:["Dashboard","PKVY Master","LRP mapping","Farmer Payment List","PGS Data Information","Activity Report","Cluster map","Bulk Upload","Complete","Reports"]},
  natural:{title:"Natural Farming", full:"Natural Farming Master only", prefix:"NF-F", menu:["Dashboard","Natural Farming Master","Krishi Sakhi mapping","Farmer Payment List","PGS Data Information","Cluster map","Bulk Upload","Complete","Reports"]},
  minikit:{title:"Minikit", full:"Minikit Master only", prefix:"MK-F", menu:["Dashboard","Minikit Master","First Information","Distribution","Result","Bulk Upload","Complete","Reports"]},
  demo:{title:"Demonstration", full:"Demonstration Master only", prefix:"DEM-F", menu:["Dashboard","Demonstration Master","First Information","Sowing Report","Result","Bulk Upload","Complete","Reports"]}
};
async function api(url, opt={}) {
  const res = await fetch(url, { credentials:"same-origin", ...opt, headers: opt.body instanceof FormData ? undefined : { "Content-Type":"application/json", ...(opt.headers||{}) } });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error||res.status+" request failed");
  return data;
}
async function boot(){ render(); try{ me=await fetch("/api/me").then(r=>r.json()); if(!me||!me.role){ me=null; render(); return; } realRole=me.role; try{ blocks=await api("/api/meta"); }catch(e){ blocks={}; } try{ window.LGD=(await api("/api/directory")).tree||{}; }catch(e){ window.LGD={}; } try{ const only=allowedSchemes(); if(only.length===1){ scheme=only[0]; tab="Dashboard"; } }catch(e){} render(); }catch(e){ me=null; render(); } }
function render(){ document.getElementById("app").innerHTML = me? shell(): login(); bind(); }
function login(){ return `<div style="min-height:100vh;position:relative;background:url('https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat"><div style="background:#0f2744cc;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center"><div><b>Department of Agriculture Ajmer</b><div style="font-size:13px;opacity:.9">Farmer & Scheme Data Management Portal</div></div><button class="line" id="openLogin">Department login</button></div><div id="loginBox" class="card login" style="display:none"><h2>Department login</h2><label>User ID</label><input id="u"/><label>Password</label><input id="p" type="password"/><p id="err" style="color:#b91c1c"></p><button class="go" id="go" style="width:100%">Login</button><p style="font-size:12px;color:#6b7280">Version 1.0</p></div><div style="position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:650;text-shadow:0 1px 4px #000">Agriculture Information Management System</div></div>`; }
function shell(){
  const HI={"Dashboard":"डैशबोर्ड","Farmer Master":"किसान मास्टर","Users & Roles":"यूजर और रोल","Master Data":"मास्टर डेटा","Notifications":"सूचना","Audit Log":"ऑडिट","Settings":"सेटिंग","PKVY Master":"पीकेवीवाई मास्टर","Natural Farming Master":"प्राकृतिक खेती मास्टर","Farmer Payment List":"किसान भुगतान सूची","PGS Data Information":"पीजीएस जानकारी","Activity Report":"गतिविधि रिपोर्ट","Result":"परिणाम","Bulk Upload":"बल्क अपलोड","Complete":"पूर्ण","Reports":"रिपोर्ट","Logout":"लॉगआउट","Hindi":"English"};
  const label=m=>window.LANG==="hi"?(HI[m]||m):m;
  const items = scheme? SCHEMES[scheme].menu.map(m=>[m,label(m)]) : [["home",label("Dashboard")],["users",label("Users & Roles")],["masters",label("Master Data")],["notes",label("Notifications")],["log",label("Audit Log")],["settings",label("Settings")]];
  let only=["pkvy","natural","minikit","demo"]; try{ only=allowedSchemes(); }catch(e){} const schemeSlide = scheme?"":(only.length===1?`<button data-s="${only[0]}">${SCHEMES[only[0]].title}</button>`:`<button data-slide="schemes">Schemes</button><div id="schemeSlide" style="display:none">${only.map(k=>`<button data-s="${k}" style="padding-left:22px">${SCHEMES[k].title}</button>`).join("")}</div>`);
  return `<div class="app"><aside><b>Farmer & Scheme Data Management Portal</b>${items.filter(([id])=>id==="home").map(([id,label])=>`<button data-t="${id}" class="${tab===id?"active":""}">${label}</button>`).join("")}${scheme?"":schemeSlide}${items.filter(([id])=>id!=="home").map(([id,label])=>`<button data-t="${id}" class="${tab===id?"active":""}">${label}</button>`).join("")}${scheme?`<button id="back">Main Dashboard</button>`:""}</aside>
  <main><header><div><b>Department of Agriculture, Ajmer</b><div style="font-size:12px;color:#6b7280">${scheme?SCHEMES[scheme].full:"Agriculture Information Management System"} · FY ${year}</div></div>
  <span>${realRole==="admin"?`<select id="viewAs"><option value="admin">System Admin</option><option value="district_admin">District Admin</option><option value="aao">AAO</option><option value="supervisor">Supervisor</option><option value="lrp">LRP</option><option value="krishi_sakhi">Krishi Sakhi / CRP</option></select>`:""}<select id="fy"><option>2025-26</option><option selected>2026-27</option><option>2027-28</option></select> <button id="lang" class="line">${window.LANG==="hi"?"English":"Hindi"}</button> ${me.name} · ${me.role} <button id="out" class="line">${window.LANG==="hi"?"लॉगआउट":"Logout"}</button></span></header>
  <div class="content" id="panel"></div></main></div>`;
}
async function show(name){
  tab=name;
  const rows=await api("/api/records");
  const mine=scheme? rows.filter(r=>r.form_type!=="farmer_master" && ((r.payload.scheme||r.form_type)===scheme || (r.payload.scheme||"")===scheme)) : rows;
  const farmers=rows.filter(r=>r.form_type==="farmer_master");
  const panel=document.getElementById("panel");
  if(!scheme && name==="home") panel.innerHTML=home(rows);
  else if(name.endsWith("Master")||name==="farmers") panel.innerHTML=schemeMaster(mine);
  else if(name==="Submit Information") panel.innerHTML=templateView(mine);
  else if(name==="users"||name==="Users & Roles") panel.innerHTML=await userView();
  else if(name==="masters"||name==="Master Data") panel.innerHTML=clusterView(await api("/api/users"));
  else if(name==="Bulk Upload"||name==="excel"||name==="Excel") panel.innerHTML=excelView();
  else if(name==="Complete") panel.innerHTML=(["supervisor","aao","admin","lrp","crp","krishi_sakhi"].includes(me.role))?verifyView(mine):`<div class="card">Sign is not open for this role.</div>`;
  else if(name==="log"||name==="Audit Log") panel.innerHTML=logView(rows);
  else if(name==="notes"||name==="Notifications") panel.innerHTML=await notePage();
  else if(name==="settings"||name==="Settings") panel.innerHTML=`<div class="card"><h3>Change password</h3><label>Current</label><input id="oldp" type="password"/><label>New</label><input id="newp" type="password"/><button class="go" id="chp">Update password</button>${me.role==="admin"?'<p><a href="/api/backup">Download backup</a></p>':""}</div>`;
  else if(name==="Dashboard") panel.innerHTML=schemeDash(mine);
  else if(name==="Reports") panel.innerHTML=reportView(mine);
  else if(name==="Reports") panel.innerHTML=reportView(mine);
  else if(name==="LRP mapping"||name==="Krishi Sakhi mapping") panel.innerHTML=roleMapView(name);
  else if(name==="Cluster map") panel.innerHTML=clusterMapView();
  else if(name==="Farmer Payment List") panel.innerHTML=paymentView(mine);
  else if(name==="PGS Data Information") panel.innerHTML=pgsView(mine);
  else panel.innerHTML=schemeForm(name, mine);
  wire();
}
function allowedSchemes(){
  if(me.role==="lrp") return ["pkvy"];
  if(me.role==="krishi_sakhi"||me.role==="crp") return ["natural"];
  if(me.role==="supervisor") return ["pkvy","natural","minikit","demo"];
  return ["pkvy","natural","minikit","demo"];
}
function home(rows){
  const card=(key,lines)=>`<div class="card"><h3>${SCHEMES[key].title}</h3>${lines.map(x=>`<div class="stat">${x}</div>`).join("")}</div>`;
  const c=k=>rows.filter(r=>(r.payload.scheme||"")===k && (r.payload.year||"2026-27")===year);
  const keys=allowedSchemes();
  const lines={pkvy:["Farmers "+c("pkvy").length,"Pending "+c("pkvy").filter(r=>r.status==="submitted").length], natural:["Farmers "+c("natural").length], minikit:["Distributed "+c("minikit").length], demo:["Planned "+c("demo").length]};
  return `<h2>Main Dashboard</h2><p style="color:#6b7280">${me.role==="supervisor"?"Agriculture Supervisor · apni gram panchayat ki sabhi scheme":me.role==="lrp"?"LRP · sirf PKVY":me.role==="krishi_sakhi"||me.role==="crp"?"Natural Farming only":"All schemes"}</p><div class="schemes">${keys.map(k=>card(k, lines[k])).join("")}</div>`;
}
function schemeDash(rows){
  const mapped=Object.entries(blocks).filter(([n,c])=>(c.schemes||[]).includes(scheme)).map(([n,c])=>`<div>${n} · ${c.gp||c.block||""}</div>`).join("")||"<p class='muted'>No mapped cluster yet</p>";
  return `<div class="card"><h3>${SCHEMES[scheme].title} Dashboard</h3><div class="schemes">
    <div class="stat">Records ${rows.length}</div><div class="stat">Pending ${rows.filter(r=>r.status==="submitted").length}</div>
    <div class="stat">Approved ${rows.filter(r=>r.status==="approved").length}</div><div class="stat">Rejected ${rows.filter(r=>r.status==="rejected").length}</div>
  </div><h3>Mapped clusters</h3>${mapped}</div>`;
}

function roleMapView(name){
  const role=name==="LRP mapping"?"lrp":"krishi_sakhi";
  const title=role==="lrp"?"LRP mapping · PKVY":"Krishi Sakhi / CRP mapping · Natural Farming";
  return `<div class="card"><h3>${title}</h3><div class="grid"><div><label>Name</label><input id="nn"/></div><div><label>Mobile</label><input id="nm"/></div><div><label>Email</label><input id="nmail"/></div><div><label>Username</label><input id="nu"/></div><div><label>Password</label><input id="np"/></div><div><label>Cluster</label><select id="ncl"></select></div></div><button class="go" id="roleAdd" data-role="${role}">Add</button></div>`;
}
function clusterMapView(){
  if(!(me.role==="admin"||me.role==="district_admin")) return `<div class="card">Cluster map is for System Admin and District Admin.</div>`;
  return `<div class="card"><h3>Cluster map</h3><div class="grid">${lgdSelects()}<div><label>Cluster name</label><input id="mapName"/></div></div><button class="go" id="mapCluster">Map cluster</button></div>`;
}
function lgdSelects(){
  const teh=Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("");
  return `<div><label>Tehsil</label><select id="fteh">${teh}</select></div><div><label>Gram Panchayat</label><select id="fgp"></select></div><div><label>Village</label><select id="village"></select></div>`;
}
function farmerMaster(rows){ rows=scheme?rows.filter(r=>(r.payload.scheme||scheme)===scheme):rows;
  return `<div class="card"><h3>Farmer Master</h3><p>Register a farmer once, then use the same Farmer ID in a scheme.</p><div class="grid"><div><label>Name</label><input id="farmer"/></div><div><label>Father/Husband</label><input id="father"/></div><div><label>Mobile</label><input id="fmobile"/></div><div><label>Jan Aadhaar</label><input id="jan" placeholder="masked in lists"/></div><div><label>Category</label><select id="category"><option>General</option><option>SC</option><option>ST</option><option>OBC</option></select></div>${lgdSelects()}<div><label>Land area</label><input id="area"/></div></div><button class="go" id="saveFarmer">Save farmer</button></div>
  <div class="card"><input id="q" placeholder="Search name / mobile" oninput="filterCards(this)"/><table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Village</th></tr>${rows.map(r=>`<tr data-q="${r.payload.farmer} ${r.payload.mobile}"><td>${r.payload.farmer_id||r.id.slice(0,8)}</td><td>${r.payload.farmer}</td><td>${r.payload.mobile||""}</td><td>${(r.payload.jan||"").length>4?"XXXX"+r.payload.jan.slice(-4):""}</td><td>${r.village||""}</td></tr>`).join("")}</table></div>`;
}

function editView(rows){
  const open=rows.filter(r=>["submitted","draft","returned","correction_required"].includes(r.status));
  return `<div class="card"><h3>Edit uploaded data</h3><p>Excel rows can be edited until signed. Reverted rows also appear here.</p>
    ${open.map(r=>`<div style="border-bottom:1px solid #eee;padding:8px 0"><b>${r.payload["Farmer Name"]||r.payload.farmer||""}</b> <span class="pill">${r.status}</span>
      <div class="grid"><div><label>Farmer Name</label><input id="e-name-${r.id}" value="${r.payload["Farmer Name"]||r.payload.farmer||""}"/></div>
      <div><label>Village</label><input id="e-vill-${r.id}" value="${r.payload.Village||r.village||""}"/></div>
      <div><label>Mobile</label><input id="e-mob-${r.id}" value="${r.payload.Mobile||""}"/></div>
      <div><label>Crop</label><input id="e-crop-${r.id}" value="${r.payload.Crop||""}"/></div></div>
      <button class="go" data-edit="${r.id}">Save edit</button></div>`).join("")||"<p>No editable records. Signed data is locked.</p>"}
  </div>`;
}


function paymentView(rows){
  const done=rows.filter(r=>r.payload.section==="payment");
  const used=new Set(done.map(r=>r.payload.farmer_id||r.payload.farmer));
  const left=rows.filter(r=>r.form_type===scheme && !used.has(r.payload.farmer_id||r.payload.farmer) && r.payload.section!=="payment");
  const opts=left.map(r=>`<option value="${r.id}">${r.payload["Farmer Name"]||r.payload.farmer||""}</option>`).join("");
  return `<div class="card"><h3>Farmer Payment List</h3><p>Select year. Amount is per hectare. Less land gets a lower amount.</p>
    <label>Year</label><select id="payYear"><option value="1">First year</option><option value="2">Second year</option><option value="3">Third year</option></select>
    <label>Farmer name with father</label><select id="payFarmer"><option value="">Select</option>${opts}</select>
    <div class="grid"><div><label>Caste</label><input id="payCaste2"/></div><div><label>Category</label><select id="payCaste" autocomplete="off"><option>Gen</option><option>SC</option><option>ST</option><option>OBC</option></select></div>
    <div><label>Village</label><input id="payVillage"/></div><div><label>Area hectare</label><input id="payArea" type="number" step="0.01"/></div>
    <div><label>Aadhaar</label><input id="payAad"/></div><div><label>Jan Aadhaar</label><input id="payJan"/></div><div><label>Mobile</label><input id="payMob"/></div>
    <div><label>Bank account</label><input id="payAcc"/></div><div><label>IFSC</label><input id="payIfsc"/></div><div><label>Bank branch</label><input id="payBranch"/></div></div>
    <p id="payCalc"></p><button class="line" id="payCalcBtn">Calculate</button> <button class="go" id="paySave">Update payment</button>
    ${left.length?"":`<button class="go" id="paySign">Send for sign</button>`}
    <h3>Updated records</h3>${done.map(r=>`<div>${r.payload.farmer} · Year ${r.payload.year_no||""} · Rs ${r.payload.amount||""}</div>`).join("")||"<p>No updated record yet</p>"}
  </div>`;
}
function pgsView(rows){
  const farmers=rows.filter(r=>r.payload.section!=="payment" && r.payload.section!=="pgs");
  const clusters=[...new Set(farmers.map(r=>r.cluster||r.payload["Cluster ID"]||"").filter(Boolean))];
  return `<div class="card"><h3>PGS Data Information</h3><p>Select the full cluster. Group code is not created here.</p>
    <label>Cluster</label><select id="pgsCluster"><option value="">Select</option>${clusters.map(c=>`<option>${c}</option>`).join("")}</select>
    <p id="pgsInfo"></p><button class="line" id="pgsBuild">Build PGS</button> <button class="go" id="pgsSave">Send for sign</button>
    <div id="pgsTable"></div></div>`;
}
function schemeMaster(rows){
  const list=rows.filter(r=>r.form_type===scheme||r.payload.scheme===scheme);
  return `<div class="card"><h3>${SCHEMES[scheme].title} Master</h3><p>This farmer stays in ${SCHEMES[scheme].title} only. ID ${SCHEMES[scheme].prefix}-000001</p>
    <div class="grid"><div><label>Name</label><input id="mname"/></div><div><label>Father</label><input id="mfather"/></div><div><label>Mobile</label><input id="mmob"/></div><div><label>Village</label><input id="mvillage"/></div><div><label>GP</label><input id="mgp2"/></div><div><label>Cluster</label><input id="mcluster"/></div></div>
    <button class="go" id="addMaster">Add farmer</button>
    <table><tr><th>ID</th><th>Name</th><th>Village</th><th>Cluster</th><th>Status</th></tr>${list.map(r=>`<tr><td>${r.payload.farmer_id||""}</td><td>${r.payload["Farmer Name"]||r.payload.farmer||""}</td><td>${r.payload.Village||""}</td><td>${r.payload["Cluster ID"]||""}</td><td>${r.status}</td></tr>`).join("")}</table>
  </div>`;
}
function templateView(rows, name){ name=name||"First Information";
  const need=scheme==="natural"?125:scheme==="pkvy"?25:1;
  const n=rows.length;
  const ready=n>=need;
  return `<div class="card"><h3>Submit Information</h3><p>Data comes from ${SCHEMES[scheme].title} Master. Farmers ${n}/${need}.</p>
    <table><tr><th>ID</th><th>Name</th><th>Village</th><th>Cluster</th></tr>${rows.map(r=>`<tr><td>${r.payload.farmer_id||""}</td><td>${r.payload["Farmer Name"]||r.payload.farmer||""}</td><td>${r.payload.Village||r.village||""}</td><td>${r.payload["Cluster ID"]||r.cluster||""}</td></tr>`).join("")}</table>
    ${ready?`<button class="go" id="sendSign">Submit for sign</button>`:`<p>Submit stays hidden until ${need} farmers are in this scheme.</p>`}
  </div>`;
}
function schemeForm(name, rows){
  const common = ["Farmer ID","Farmer Name","Father/Husband Name","Gender","Category","Mobile","Jan Aadhaar","District","Tehsil","Block","Gram Panchayat","Village","Total Land Area"];
  const extra = {
    pkvy:["Financial Year","Season","PKVY Cluster ID","Registration Date","Participation Status","Existing/New","Khasra No","Cultivated Area","PKVY Area","Land Ownership","Soil Test","Crop","Variety","Crop Area","Activity","Activity Area","Remarks"],
    natural:["Financial Year","Season","Cluster ID","Adoption Status","Existing/New","Khasra No","Natural Farming Area","Practice","Practice Area","Crop","Variety","Input Name","Input Quantity","Training Attended","Training Date","Remarks"],
    minikit:["Financial Year","Component","Distribution Date","Distribution Location","Crop","Variety","Item Name","Lot/Batch No","Quantity","Unit","Receiver Confirmation"],
    demo:["Financial Year","Demonstration Type","Category","Season","Demonstration Date","Location","Khasra No","Demonstration Area","Crop","Variety","Technology","Intervention","Expected Yield","Demonstration Yield","Result"]
  }[scheme]||[];
  const opts = {Season:["Kharif","Rabi","Zaid"], "Land Ownership":["Owner","Lease"], "Soil Test":["No","Yes"], "Existing/New":["Existing","New"], "Participation Status":["Active","Inactive"], "Adoption Status":["Adopted","Partial","Not adopted"], Practice:["Beejamrit","Jeevamrit","Ghan Jeevamrit","Mulching","Waaphasa","Intercropping","Other"], Unit:["Kg","Gram","Litre","Packet"], Component:["Seed","Nutrient","Other"], "Demonstration Type":["Crop","Technology","Input"], Category:["Frontline","Cluster"], "Receiver Confirmation":["Yes","No"]};
  const field=(label, ro)=>`<div><label>${label}</label>${opts[label]?`<select id="f-${label.replace(/[^a-zA-Z]/g,"")}" ${ro}>${opts[label].map(o=>`<option>${o}</option>`).join("")}</select>`:`<input id="f-${label.replace(/[^a-zA-Z]/g,"")}" ${ro?"readonly":""}/>`}</div>`;
  return `<div class="card"><h3>${SCHEMES[scheme].title} · ${name}</h3><label>Farmer ID search</label><input id="searchFarmer" placeholder="FRM-2026"/><button type="button" class="line" id="loadFarmer">Load master</button><p id="masterBox" class="muted"></p><div class="grid">${common.map(f=>field(f,true)).join("")}${extra.map(f=>field(f,false)).join("")}</div><p id="cond"></p><label>Photo</label><input id="photo" type="file" accept="image/*" capture="environment"/><button class="line" id="draft">Save draft</button> <button class="go" id="submit">Submit</button></div><div class="card">${rows.filter(r=>r.payload.section===name).map(r=>`<div>${r.payload.application_no} · ${r.payload.farmer||""} <span class="pill">${r.status}</span></div>`).join("")||"No records"}</div>`;
}

async function saveRecord(status){

}

  if(mapGp) mapGp.onclick=async()=>{ const r=await api("/api/map/gp",{method:"POST", body:JSON.stringify({username:supUser.value, tehsil:steh.value, gp:sgp.value})}); alert("Cluster auto add: "+r.cluster); blocks=await api("/api/meta"); };
  const mapv=document.getElementById("mapv");
  if(mapv) mapv.onclick=async()=>{ await api("/api/directory/village",{method:"POST", body:JSON.stringify({tehsil:mteh.value, gp:mgp.value, village:mvill.value})}); window.LGD=(await api("/api/directory")).tree||{}; alert("Added to the dropdown"); show("masters"); };
  const chp=document.getElementById("chp"); if(chp) chp.onclick=async()=>{ try{ await api("/api/password",{method:"POST", body:JSON.stringify({old:oldp.value,password:newp.value})}); alert("Password updated"); }catch(e){ alert(e.message);} };
  const sendExcel=async(preview)=>{ const file=document.getElementById("xf").files[0]; if(!file) return alert("Choose an Excel file first"); const fd=new FormData(); fd.append("file", file); fd.append("scheme", scheme||"pkvy"); if(preview) fd.append("preview","1"); const res=await api("/api/excel",{method:"POST", body:fd}); document.getElementById("xr").innerHTML=`<p><b>${res.message||""}</b></p><p>Valid ${res.valid||res.saved||0}. Invalid ${(res.errors||[]).length}</p>`+(res.errors||[]).map(e=>`<p style="color:#b91c1c">Row ${e.row}: ${String(e.detail||"").replace(/</g,"")}</p>`).join("")+(res.error_file?`<p><a href="/api/errors/${res.error_file}">Download error sheet</a></p>`:""); };
  const xp=document.getElementById("xp"); if(xp) xp.onclick=()=>sendExcel(true).catch(e=>alert(e.message));
  const pu=document.getElementById("pu"); if(pu) pu.onclick=async()=>{ const file=document.getElementById("pf").files[0]; if(!file) return alert("Choose a photo"); const fd=new FormData(); fd.append("file", file); fd.append("scheme", scheme||"pkvy"); const box=document.getElementById("xr"); box.innerHTML="<p>Reading photo...</p>"; try{ const res=await fetch("/api/photo-excel",{method:"POST", body:fd}); const data=await res.json(); const why=(data.reasons||[]).map(x=>`<p>${x}</p>`).join(""); box.innerHTML=`<p><b>${data.message||""}</b></p>${why}<pre>${data.text||""}</pre>`+(data.ok?`<button class="go" id="photoSubmit">Submit</button>`:""); const b=document.getElementById("photoSubmit"); if(b) b.onclick=async()=>{ await api("/api/photo-save",{method:"POST", body:JSON.stringify({scheme, rows:data.rows})}); alert("Added to Farmer Master"); show("Submit Information"); }; }catch(e){ box.innerHTML="<p>Photo could not be read.</p>"; } };
  const xu=document.getElementById("xu");
  if(xu) xu.onclick=async()=>{
    try{
      const file=document.getElementById("xf").files[0];
      if(!file) return alert("Choose an Excel file first");
      const fd=new FormData();
      fd.append("file", file);
      fd.append("scheme", scheme||"pkvy");
      const res=await api("/api/excel",{method:"POST", body:fd});
      document.getElementById("xr").innerHTML=`<p><b>${res.message||""}</b></p><p>${res.saved||0} saved. Invalid ${(res.errors||[]).length}</p>`+(res.errors||[]).map(e=>`<p style="color:#b91c1c">Row ${e.row}: ${String(e.detail||"").replace(/</g,"")}</p>`).join("")+(res.error_file?`<p><a class="go" href="/api/errors/${res.error_file}">Download error sheet</a></p>`:"<p>No errors</p>");
    }catch(e){ alert(e.message); }
  };
  const roleAdd=document.getElementById("roleAdd"); if(roleAdd) roleAdd.onclick=async()=>{ const role=roleAdd.dataset.role; const cluster=document.getElementById("ncl").value; if(!cluster) return alert("Map a cluster first"); await api("/api/users",{method:"POST", body:JSON.stringify({name:nn.value, role, cluster, mobile:nm.value, email:nmail.value, username:nu.value, password:np.value})}); alert("Mapped"); show(role==="lrp"?"LRP mapping":"Krishi Sakhi mapping"); };
  const add=document.getElementById("nuadd"); if(add) add.onclick=async()=>{
    try {
      const role=document.getElementById("nr").value;
      const clusterEl=document.getElementById("ncl");
      const cluster=clusterEl&&clusterEl.value&&!clusterEl.value.startsWith("Pehle")?clusterEl.value:"All";
      if((role==="lrp"||role==="krishi_sakhi"||role==="crp"||role==="supervisor") && cluster==="All") return alert("Map a cluster first");
      await api("/api/users",{method:"POST", body:JSON.stringify({name:document.getElementById("nn").value, role, cluster, mobile:document.getElementById("nm").value, username:document.getElementById("nu").value, password:document.getElementById("np").value})});
      if(role==="supervisor"){ const r=await api("/api/map/gp",{method:"POST", body:JSON.stringify({username:document.getElementById("nu").value, tehsil:document.getElementById("nteh").value, gp:document.getElementById("ngp").value})}); alert("GP and cluster assigned: "+r.cluster); }
      if(role==="aao"){ const picked=[...document.getElementById("aaoSup").selectedOptions].map(o=>o.value); await api("/api/map/aao",{method:"POST", body:JSON.stringify({username:document.getElementById("nu").value, block:aaoBlock.value, office_type:aaoOffice.value, office_name:aaoOfficeName.value, supervisors:picked})}); alert("AAO mapped"); }
      else alert("User created");
      show("users");
    } catch(e) { alert(e.message); }
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("Delete?")) return; await api("/api/users/"+b.dataset.del,{method:"DELETE"}); show("users"); });
  applyLang();
}
function filterCards(el){ document.querySelectorAll("[data-q]").forEach(n=>n.style.display=n.dataset.q.toLowerCase().includes(el.value.toLowerCase())?"":"none"); }
function applyLang(){
  if(window.LANG!=="hi") return;
  const map=[["Farmer Payment List","किसान भुगतान सूची"],["Father/Husband Name","पिता/पति का नाम"],["Jan Aadhaar","जन आधार"],["Aadhaar No","आधार नंबर"],["Aadhaar","आधार"],["Farmer Name","किसान का नाम"],["Bank account","बैंक खाता"],["Bank branch","बैंक शाखा"],["Area hectare","क्षेत्र हेक्टेयर"],["Financial Year","वित्तीय वर्ष"],["Gram Panchayat","ग्राम पंचायत"],["Upload Excel","एक्सेल अपलोड"],["Read photo","फोटो पढ़ें"],["Generate PDF","पीडीएफ बनाएँ"],["Export Excel","एक्सेल निकालें"],["Update payment","भुगतान अपडेट"],["Send for sign","साइन के लिए भेजें"],["Sign & submit","साइन और जमा"],["Save draft","ड्राफ्ट सेव"],["Bulk Upload","बल्क अपलोड"],["Select year","वर्ष चुनें"],["Village","गाँव"],["Mobile","मोबाइल"],["Caste","जाति"],["Category","श्रेणी"],["Calculate","गणना"],["Submit","जमा करें"],["Preview","पूर्वावलोकन"],["Logout","लॉगआउट"],["Year","वर्ष"],["Name","नाम"],["Role","भूमिका"],["Password","पासवर्ड"]];
  const walk=document.createTreeWalker(document.getElementById("app"), NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n=>{ let v=n.nodeValue; map.forEach(([a,b])=>{ if(v.includes(a)) v=v.split(a).join(b); }); n.nodeValue=v; });
}
function bind(){ const openLogin=document.getElementById("openLogin"); if(openLogin) openLogin.onclick=()=>{ document.getElementById("loginBox").style.display="block"; }; const go=document.getElementById("go"); if(go){ go.onclick=async()=>{ try{ await api("/api/login",{method:"POST", body:JSON.stringify({username:u.value,password:p.value})}); window.LANG=localStorage.getItem("lang")||"en"; boot(); }catch(e){ err.textContent=e.message; } }; return; } const langBtn=document.getElementById("lang"); if(langBtn) langBtn.onclick=()=>{ window.LANG=window.LANG==="hi"?"en":"hi"; localStorage.setItem("lang", window.LANG); render(); }; document.getElementById("out").onclick=async()=>{ await api("/api/logout",{method:"POST"}); me=null; scheme=null; render(); }; document.querySelectorAll("aside button[data-t]").forEach(b=>b.onclick=()=>show(b.dataset.t)); const slide=document.querySelector("[data-slide]"); if(slide) slide.onclick=()=>{ const box=document.getElementById("schemeSlide"); box.style.display=box.style.display==="none"?"block":"none"; }; document.querySelectorAll("aside button[data-s]").forEach(b=>b.onclick=()=>{ if(!allowedSchemes().includes(b.dataset.s)) return alert("This scheme is not open for this role"); scheme=b.dataset.s; tab="Dashboard"; render(); }); show(scheme?tab:"home").then(applyLang); }
window.LANG=localStorage.getItem("lang")||"en"; boot();
</script>
