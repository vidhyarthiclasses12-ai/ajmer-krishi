<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ajmer Agriculture Information</title>
<style>
  :root { --side:#14532d; --bg:#f3f4f6; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",sans-serif; background:var(--bg); color:#111827; }
  button, input, select, textarea { font:inherit; }
  button { cursor:pointer; border:0; border-radius:8px; padding:8px 12px; font-weight:700; }
  .go { background:#166534; color:#fff; } .line { background:#fff; border:1px solid #bbf7d0; color:#166534; } .bad { background:#fee2e2; color:#b91c1c; }
  input, select, textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:4px; }
  label { font-size:13px; font-weight:700; display:block; margin-top:8px; }
  .app { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
  aside { background:var(--side); color:#fff; padding:12px; }
  aside button { display:block; width:100%; text-align:left; background:transparent; color:#d1fae5; margin-bottom:4px; }
  aside button.active { background:#166534; color:#fff; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .content { padding:16px; }
  .card { background:#fff; border-radius:12px; padding:14px; border:1px solid #eef2f7; margin-bottom:12px; }
  .schemes { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat { background:#f8fafc; border-radius:10px; padding:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pill { background:#dcfce7; color:#166534; border-radius:99px; padding:2px 8px; font-size:11px; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px; border-bottom:1px solid var(--line); }
  .login { max-width:420px; margin:40px auto; }
  @media (max-width:800px) { .app { grid-template-columns:1fr; } .schemes,.grid { grid-template-columns:1fr; } aside { display:flex; overflow:auto; } aside button { width:auto; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
let me=null, blocks={}, scheme=null, tab="home", year="2026-27";
const SCHEMES={
  pkvy:{title:"PKVY", full:"Paramparagat Krishi Vikas Yojana", menu:["Dashboard","Cluster","Farmer","Activity","Verification","Reports"]},
  natural:{title:"Natural Farming", full:"प्राकृतिक खेती", menu:["Dashboard","Farmer","Activity","Field Visit","Verification","Reports"]},
  minikit:{title:"Minikit", full:"Minikit Distribution", menu:["Dashboard","Stock","Beneficiary","Distribution","Verification","Reports"]},
  demo:{title:"Demonstration", full:"फसल/तकनीकी प्रदर्शन", menu:["Dashboard","Planning","Field","Visit","Verification","Reports"]}
};
async function api(url, opt={}) {
  const res = await fetch(url, { credentials:"same-origin", headers: opt.body instanceof FormData ? undefined : { "Content-Type":"application/json" }, ...opt });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error||"Error");
  return data;
}
async function boot(){ me=await fetch("/api/me").then(r=>r.json()); if(me){ blocks=await api("/api/meta"); window.LGD=(await api("/api/directory")).tree||{}; } render(); }
function render(){ document.getElementById("app").innerHTML = me? shell(): login(); bind(); }
function login(){ return `<div class="card login"><h2 style="color:#166534">Ajmer Agriculture Information</h2><label>Username</label><input id="u"/><label>Password</label><input id="p" type="password"/><p id="err" style="color:#b91c1c"></p><button class="go" id="go" style="width:100%">Login</button><p style="font-size:12px;color:#6b7280">Help: जिला कृषि कार्यालय, अजमेर · Version 1.0</p></div>`; }
function shell(){
  const items = scheme? SCHEMES[scheme].menu.map(m=>[m,m]) : [["home","Dashboard"],["farmers","Farmer Master"],["users","Users & Roles"],["masters","Master Data"],["excel","Excel"],["log","Audit Log"],["settings","Settings"]];
  return `<div class="app"><aside><b>KRISHI WEB APP</b>${items.map(([id,label])=>`<button data-t="${id}" class="${tab===id?"active":""}">${label}</button>`).join("")}${scheme?`<button id="back">Main Dashboard</button>`:""}</aside>
  <main><header><div><b>Ajmer Agriculture Information</b><div style="font-size:12px;color:#6b7280">${scheme?SCHEMES[scheme].full:"Department of Agriculture"} · FY ${year}</div></div>
  <span><select id="fy"><option>2025-26</option><option selected>2026-27</option><option>2027-28</option></select> ${me.name} · ${me.role} <button id="out" class="line">Logout</button></span></header>
  <div class="content" id="panel"></div></main></div>`;
}
async function show(name){
  tab=name;
  const rows=await api("/api/records");
  const mine=scheme? rows.filter(r=>(r.payload.scheme||r.form_type)===scheme && (r.payload.year||year)===year) : rows;
  const farmers=rows.filter(r=>r.form_type==="farmer_master");
  const panel=document.getElementById("panel");
  if(!scheme && name==="home") panel.innerHTML=home(rows);
  else if(name==="farmers"||name==="Farmer") panel.innerHTML=farmerMaster(farmers);
  else if(name==="users"||name==="Users & Roles") panel.innerHTML=await userView();
  else if(name==="masters"||name==="Master Data") panel.innerHTML=clusterView(await api("/api/users"));
  else if(name==="excel"||name==="Excel") panel.innerHTML=excelView();
  else if(name==="log"||name==="Audit Log") panel.innerHTML=logView(rows);
  else if(name==="settings"||name==="Settings") panel.innerHTML=`<div class="card"><h3>Settings</h3><p>Financial year upar se badlega. Purana saal ka data delete nahi hota.</p></div>`;
  else if(name==="Dashboard") panel.innerHTML=schemeDash(mine);
  else if(name==="Verification") panel.innerHTML=verifyView(mine);
  else if(name==="Reports") panel.innerHTML=reportView(mine);
  else panel.innerHTML=schemeForm(name, mine);
  wire();
}
function allowedSchemes(){
  if(me.role==="lrp") return ["pkvy"];
  if(me.role==="krishi_sakhi"||me.role==="crp") return ["natural"];
  if(me.role==="supervisor") return ["pkvy","natural","minikit","demo"];
  return ["pkvy","natural","minikit","demo"];
}
function home(rows){
  const card=(key,lines)=>`<div class="card"><h3>${SCHEMES[key].title}</h3><p style="color:#6b7280">${SCHEMES[key].full}</p>${lines.map(x=>`<div class="stat">${x}</div>`).join("")}<button class="go" data-open="${key}">OPEN ${SCHEMES[key].title}</button></div>`;
  const c=k=>rows.filter(r=>(r.payload.scheme||"")===k && (r.payload.year||"2026-27")===year);
  const keys=allowedSchemes();
  const lines={pkvy:["Farmers "+c("pkvy").length,"Pending "+c("pkvy").filter(r=>r.status==="submitted").length], natural:["Farmers "+c("natural").length], minikit:["Distributed "+c("minikit").length], demo:["Planned "+c("demo").length]};
  return `<h2>Main Dashboard</h2><p style="color:#6b7280">${me.role==="supervisor"?"Agriculture Supervisor · apni gram panchayat ki sabhi scheme":me.role==="lrp"?"LRP · sirf PKVY":me.role==="krishi_sakhi"||me.role==="crp"?"Sirf Natural Farming":"Sabhi scheme"}</p><div class="schemes">${keys.map(k=>card(k, lines[k])).join("")}</div>`;
}
function schemeDash(rows){
  const map = (scheme==="pkvy"||scheme==="natural") && (me.role==="admin"||me.role==="district_admin") ? `<div class="card"><h3>Cluster map</h3><div class="grid">${lgdSelects()}<div><label>Cluster name</label><input id="mapName"/></div></div><button class="go" id="mapCluster">Map cluster</button></div>` : "";
  return `<div class="card"><h3>${SCHEMES[scheme].title} Dashboard</h3><div class="schemes">
    <div class="stat">Records ${rows.length}</div><div class="stat">Pending ${rows.filter(r=>r.status==="submitted").length}</div>
    <div class="stat">Approved ${rows.filter(r=>r.status==="approved").length}</div><div class="stat">Rejected ${rows.filter(r=>r.status==="rejected").length}</div>
  </div></div>${map}`;
}
function lgdSelects(){
  const teh=Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("");
  return `<div><label>Tehsil</label><select id="fteh">${teh}</select></div><div><label>Gram Panchayat</label><select id="fgp"></select></div><div><label>Village</label><select id="village"></select></div>`;
}
function farmerMaster(rows){
  return `<div class="card"><h3>Farmer Master</h3><p>Ek baar register, phir har scheme me search karke jodein.</p><div class="grid"><div><label>Name</label><input id="farmer"/></div><div><label>Father/Husband</label><input id="father"/></div><div><label>Mobile</label><input id="fmobile"/></div><div><label>Category</label><select id="category"><option>General</option><option>SC</option><option>ST</option><option>OBC</option></select></div>${lgdSelects()}<div><label>Land area</label><input id="area"/></div></div><button class="go" id="saveFarmer">Save farmer</button></div>
  <div class="card"><input id="q" placeholder="Search name / mobile" oninput="filterCards(this)"/><table><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Village</th></tr>${rows.map(r=>`<tr data-q="${r.payload.farmer} ${r.payload.mobile}"><td>${r.payload.farmer_id||r.id.slice(0,8)}</td><td>${r.payload.farmer}</td><td>${r.payload.mobile||""}</td><td>${r.village||""}</td></tr>`).join("")}</table></div>`;
}
function schemeForm(name, rows){
  const fields={
    Cluster:["Cluster name","Area","Coordinator","Activity"],
    Activity:["Activity","Crop","Quantity","Unit","Cost"],
    Stock:["Crop","Variety","Lot","Quantity received","Challan"],
    Beneficiary:["Farmer ID","Crop","Variety","Kit type","Quantity"],
    Distribution:["Farmer ID","Lot","Quantity","Distribution date","Location"],
    Planning:["Crop","Variety","Target farmers","Target area","Proposed date"],
    Field:["Farmer ID","Khasra","Area","Crop","Technology"],
    Visit:["Visit date","Officer","Observation","Advice","Result"],
    "Field Visit":["Visit date","Officer","Crop","Observation","Advice"]
  }[name]||["Farmer ID","Crop","Area","Remarks"];
  return `<div class="card"><h3>${SCHEMES[scheme].title} · ${name}</h3><label>Search farmer</label><input id="searchFarmer" placeholder="Farmer ID / mobile / name"/><div class="grid">${lgdSelects()}${fields.map(f=>`<div><label>${f}</label><input id="f-${f.replace(/\\s/g,"")}"/></div>`).join("")}</div><button class="line" id="draft">Save draft</button> <button class="go" id="submit">Submit</button></div>
  <div class="card">${rows.filter(r=>r.payload.section===name).map(r=>`<div>${r.payload.application_no} · ${r.payload.farmer||r.payload.section} <span class="pill">${r.status}</span></div>`).join("")||"No records"}</div>`;
}
function verifyView(rows){
  return `<div class="card"><h3>${SCHEMES[scheme].title} Verification</h3>${rows.map(r=>`<div style="border-bottom:1px solid #eee;padding:8px 0"><b>${r.payload.application_no||""}</b> ${r.payload.farmer||""} <span class="pill">${r.status}</span><label>Remark</label><input id="rm-${r.id}"/><button class="go" data-st="${r.id}" data-s="approved">Verify</button> <button class="line" data-st="${r.id}" data-s="correction_required">Return</button> <button class="bad" data-st="${r.id}" data-s="rejected">Reject</button></div>`).join("")||"No records"}</div>`;
}
function reportView(rows){
  return `<div class="card"><h3>${SCHEMES[scheme].title} Reports · ${year}</h3><p><a href="/api/export">Export Excel</a></p><table><tr><th>No</th><th>Section</th><th>Farmer</th><th>Status</th></tr>${rows.map(r=>`<tr><td>${r.payload.application_no||""}</td><td>${r.payload.section||""}</td><td>${r.payload.farmer||""}</td><td>${r.status}</td></tr>`).join("")}</table></div>`;
}
function clusterView(users=[]){
  const tehs = Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("");
  const map = me.role==="admin" ? `<div class="card"><h3>Map village</h3>
    <div class="grid"><div><label>Tehsil</label><select id="mteh">${tehs}</select></div>
    <div><label>Gram Panchayat</label><select id="mgp"></select></div>
    <div><label>Village name</label><input id="mvill"/></div></div>
    <button class="go" id="mapv">Add to dropdown</button></div>` : `<div class="card">Village map sirf System Admin karega. Aap dropdown use karein.</div>`;
  const gpMap = (me.role==="admin"||me.role==="district_admin") ? `<div class="card"><h3>Supervisor GP map</h3><p>GP map karte hi us GP ka cluster aur gaon auto jud jayenge.</p><label>Supervisor</label><select id="supUser">${users.filter(u=>u.role==="supervisor"&&u.active!==0).map(u=>`<option value="${u.username}">${u.name} · ${u.username}</option>`).join("")||"<option value=\"\">Pehle supervisor banayein</option>"}</select><div class="grid"><div><label>Tehsil</label><select id="steh">${Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("")}</select></div><div><label>Gram Panchayat</label><select id="sgp"></select></div></div><button class="go" id="mapGp">Map GP</button></div>` : "";
  return `<div class="card"><h3>Master Data</h3><p>Tehsil ${Object.keys(window.LGD||{}).length}</p></div>${map}${gpMap}`;
}
function excelView(){ return `<div class="card"><h3>Excel</h3><p>Scheme template: ${scheme||"common"}. Duplicate aur missing field error report ke saath aayenge.</p><input id="xf" type="file" accept=".xlsx"/><button class="go" id="xu">Upload</button><div id="xr"></div><p><a href="/api/export">Consolidated export</a></p></div>`; }
function logView(rows){ const logs=rows.flatMap(r=>(r.history||[]).map(h=>`<tr><td>${h.at.slice(0,16)}</td><td>${h.by_name}</td><td>${h.status}</td><td>${h.note||""}</td></tr>`)); return `<div class="card"><h3>Audit Log</h3><table><tr><th>Time</th><th>User</th><th>Status</th><th>Remark</th></tr>${logs.join("")}</table></div>`; }
async function userView(){ if(me.role!=="admin"&&me.role!=="district_admin") return `<div class="card">Users System Admin aur District Admin dekh sakte hain.</div>`; const users=await api("/api/users"); return `<div class="card"><h3>New user</h3><div class="grid"><div><label>Name</label><input id="nn"/></div><div><label>Role</label><select id="nr">${me.role==="admin"?'<option value="district_admin">District Admin</option>':''}<option value="supervisor">Agriculture Supervisor</option><option value="lrp">LRP · PKVY</option><option value="krishi_sakhi">Krishi Sakhi · Natural Farming</option><option value="crp">CRP · Natural Farming</option></select></div><div><label>Cluster</label><select id="ncl">${Object.keys(blocks).map(b=>`<option>${b}</option>`).join("")}</select></div><div><label>Post</label><input id="npost" placeholder="Agriculture Research Officer"/></div><div><label>Mobile</label><input id="nm"/></div><div><label>Username</label><input id="nu"/></div><div><label>Password</label><input id="np"/></div></div><div id="supGpBox"><label>Supervisor GP assign</label><div class="grid"><div><label>Tehsil</label><select id="nteh">${Object.keys(window.LGD||{}).map(t=>`<option>${t}</option>`).join("")}</select></div><div><label>Gram Panchayat</label><select id="ngp"></select></div></div></div><button class="go" id="nuadd">Add</button><div>${users.filter(u=>u.active!==0).map(u=>`<div>${u.name} · ${u.role} · ${u.username} ${me.role==="admin"&&u.id!==me.id?`<button class="bad" data-del="${u.id}">Delete</button>`:""}</div>`).join("")}</div></div>`; }
function fillVillages(){ const teh=document.getElementById("fteh"), gp=document.getElementById("fgp"), vill=document.getElementById("village"); if(!teh||!gp||!vill) return; const keep=gp.value; gp.innerHTML=Object.keys((window.LGD||{})[teh.value]||{}).map(g=>`<option ${g===keep?"selected":""}>${g}</option>`).join(""); vill.innerHTML=(((window.LGD||{})[teh.value]||{})[gp.value]||[]).map(v=>`<option>${v}</option>`).join(""); }
async function saveRecord(status){
  const payload={ scheme, year, section:tab, application_no:(scheme||"GEN").toUpperCase()+"-"+Date.now().toString().slice(-8), farmer: (document.getElementById("farmer")||{}).value || (document.getElementById("searchFarmer")||{}).value, status };
  document.querySelectorAll("[id^='f-']").forEach(el=>payload[el.id.slice(2)]=el.value);
  await api("/api/records",{method:"POST", body:JSON.stringify({ cluster:me.cluster, village:(document.getElementById("village")||{}).value||"", form_type:scheme||"common", payload })});
  alert(status==="draft"?"Draft saved":"Submitted"); show(tab);
}
function wire(){
  fillVillages();
  const teh=document.getElementById("fteh"); if(teh) teh.onchange=()=>fillVillages();
  const gp=document.getElementById("fgp"); if(gp) gp.onchange=()=>fillVillages();
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ scheme=b.dataset.open; tab="Dashboard"; render(); });
  const back=document.getElementById("back"); if(back) back.onclick=()=>{ scheme=null; tab="home"; render(); };
  const fy=document.getElementById("fy"); if(fy) fy.onchange=()=>{ year=fy.value; show(tab); };
  const sf=document.getElementById("saveFarmer"); if(sf) sf.onclick=async()=>{ await api("/api/records",{method:"POST", body:JSON.stringify({ cluster:me.cluster, village:village.value, form_type:"farmer_master", payload:{ farmer_id:"FMR"+Date.now().toString().slice(-6), farmer:farmer.value, father:father.value, mobile:fmobile.value, category:category.value, year }})}); show("farmers"); };
  const sub=document.getElementById("submit"); if(sub) sub.onclick=()=>saveRecord("submitted");
  const dr=document.getElementById("draft"); if(dr) dr.onclick=()=>saveRecord("draft");
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{ const note=(document.getElementById("rm-"+b.dataset.st)||{}).value||""; if((b.dataset.s==="rejected"||b.dataset.s==="correction_required")&&!note) return alert("Reason likhna zaroori hai"); await api("/api/records/"+b.dataset.st+"/status",{method:"POST", body:JSON.stringify({status:b.dataset.s, note})}); show("Verification"); });
  const fillMap=()=>{ const t=document.getElementById("mteh"), g=document.getElementById("mgp"); if(!t||!g) return; const keep=g.value; g.innerHTML=Object.keys((window.LGD||{})[t.value]||{}).map(x=>`<option ${x===keep?"selected":""}>${x}</option>`).join(""); };
  if(document.getElementById("mteh")){ fillMap(); document.getElementById("mteh").onchange=fillMap; document.getElementById("mgp").onchange=fillMap; }
  const mapCluster=document.getElementById("mapCluster");
  if(mapCluster) mapCluster.onclick=async()=>{ const picked=[...document.getElementById("village").selectedOptions].map(o=>o.value); await api("/api/map/cluster",{method:"POST", body:JSON.stringify({scheme, name:mapName.value, tehsil:fteh.value, gp:fgp.value, villages:picked.length?picked:[village.value]})}); alert("Cluster map ho gaya"); };
  const mapGp=document.getElementById("mapGp");
  if(document.getElementById("steh")){ const fill=()=>{ g=sgp; g.innerHTML=Object.keys((window.LGD||{})[steh.value]||{}).map(x=>`<option>${x}</option>`).join(""); }; fill(); steh.onchange=fill; }
  if(document.getElementById("nteh")){ const filln=()=>{ ngp.innerHTML=Object.keys((window.LGD||{})[nteh.value]||{}).map(x=>`<option>${x}</option>`).join(""); }; filln(); nteh.onchange=filln; const toggle=()=>{ document.getElementById("supGpBox").style.display=nr.value==="supervisor"?"":"none"; }; if(document.getElementById("nr")){ toggle(); nr.onchange=toggle; } }
  if(mapGp) mapGp.onclick=async()=>{ const r=await api("/api/map/gp",{method:"POST", body:JSON.stringify({username:supUser.value, tehsil:steh.value, gp:sgp.value})}); alert("Cluster auto add: "+r.cluster); blocks=await api("/api/meta"); };
  const mapv=document.getElementById("mapv");
  if(mapv) mapv.onclick=async()=>{ await api("/api/directory/village",{method:"POST", body:JSON.stringify({tehsil:mteh.value, gp:mgp.value, village:mvill.value})}); window.LGD=(await api("/api/directory")).tree||{}; alert("Dropdown me aa gaya"); show("masters"); };
  const add=document.getElementById("nuadd"); if(add) add.onclick=async()=>{ await api("/api/users",{method:"POST", body:JSON.stringify({name:nn.value, role:nr.value, cluster:ncl.value||"All", mobile:nm.value, username:nu.value, password:np.value})}); if(nr.value==="supervisor" && ngp.value){ const r=await api("/api/map/gp",{method:"POST", body:JSON.stringify({username:nu.value, tehsil:nteh.value, gp:ngp.value})}); alert("GP aur cluster assign: "+r.cluster);} show("users"); };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ if(!confirm("Delete?")) return; await api("/api/users/"+b.dataset.del,{method:"DELETE"}); show("users"); });
}
function filterCards(el){ document.querySelectorAll("[data-q]").forEach(n=>n.style.display=n.dataset.q.toLowerCase().includes(el.value.toLowerCase())?"":"none"); }
function bind(){ const go=document.getElementById("go"); if(go){ go.onclick=async()=>{ try{ await api("/api/login",{method:"POST", body:JSON.stringify({username:u.value,password:p.value})}); boot(); }catch(e){ err.textContent=e.message; } }; return; } document.getElementById("out").onclick=async()=>{ await api("/api/logout",{method:"POST"}); me=null; scheme=null; render(); }; document.querySelectorAll("aside button[data-t]").forEach(b=>b.onclick=()=>show(b.dataset.t)); show(scheme?tab:"home"); }
boot();
</script>
</body>
</html>
